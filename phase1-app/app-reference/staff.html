<!doctype html>
<!-- スタッフ画面(B案: 白地+機能ごとの色。ティール=ポイント使用・紫=会員・オレンジ=本日の来店・青=集計。成功=緑/注意=オレンジ/失敗=赤)。
     権限の判定は DB の関数側(画面の出し分けは補助)。描画は textContent のみ(innerHTML は使わない)。外部の CDN・フォントは使わない。 -->
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>10ZEN スタッフ</title>
<style>
:root{
  --bg:#f3f5f8; --card:#fff; --fg:#1c2430; --muted:#5b6675; --line:#e3e7ee;
  --teal:#0f9d8f; --teal-soft:#e3f5f2; --purple:#7a5af5; --purple-soft:#eee9fe;
  --orange:#d9670f; --orange-soft:#fff0e2; --blue:#2f7fe0; --blue-soft:#e6f0fc;
  --ok:#1f8a4c; --ok-soft:#e4f6ea; --warn:#c75f0e; --warn-soft:#fff1e3; --bad:#c93a3a; --bad-soft:#fde8e8;
  --radius:16px; color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.55;cursor:default}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}

/* 上部: ロゴ・ログイン中・ログアウト */
.topbar{background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:12px;padding-top:max(10px,env(safe-area-inset-top))}
.logo{height:36px;width:auto;display:block}
#who{margin-left:auto;color:var(--muted);font-size:14px;min-width:0;overflow-wrap:anywhere;text-align:right}
.btn-ghost{min-height:44px;padding:0 16px;border:1.5px solid var(--line);background:var(--card);border-radius:12px;font-weight:700;font-size:14px;white-space:nowrap}

/* タブ(機能ごとの色) */
#nav{background:var(--card);border-bottom:1px solid var(--line);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:0 8px}
#nav button{min-height:48px;border:0;background:none;font-weight:700;font-size:14px;color:var(--muted);border-bottom:3px solid transparent;padding:4px 2px;line-height:1.25}
#nav button[data-tab=redeem]{--c:var(--teal)} #nav button[data-tab=members]{--c:var(--purple)} #nav button[data-tab=today]{--c:var(--orange)} #nav button[data-tab=dash]{--c:var(--blue)}
#nav button[aria-current=page]{color:var(--c);border-bottom-color:var(--c)}

main{max-width:1080px;margin:0 auto;padding:20px 16px 40px;display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
h1,h2,h3{margin:0}
.title{display:flex;align-items:center;gap:10px;font-size:26px;line-height:1.2}
.title svg{width:30px;height:30px;flex:none}
.muted{color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;display:grid;gap:14px}
.row-flex{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.asof{margin-left:auto;color:var(--muted);font-size:13px}
.pill{font-size:13px;font-weight:800;padding:4px 12px;border-radius:999px;background:#eef1f5;color:var(--muted);white-space:nowrap}
.input{flex:1 1 220px;min-width:0;width:100%;min-height:60px;border:2px solid var(--line);border-radius:14px;padding:0 16px;font-size:18px;background:var(--card)}
.input:focus{border-color:var(--c,var(--teal));outline:none}
.btn{min-height:60px;padding:0 24px;border:0;border-radius:14px;background:var(--c,var(--teal));color:#fff;font-size:18px;font-weight:800;white-space:nowrap}
.btn.sub{min-height:44px;font-size:15px;padding:0 16px;background:var(--card);color:var(--c,var(--teal));border:2px solid var(--c,var(--teal))}

/* 結果の表示: 色・アイコン・文言の3点セット */
.msg{display:flex;align-items:flex-start;gap:10px;border-radius:14px;padding:14px 16px;border:2px solid;font-weight:700}
.msg .ic{flex:none;font-weight:900}
.msg p{margin:0}
.msg.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.msg.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.msg.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.msg.info{background:#f5f7fa;border-color:var(--line);color:var(--muted)}
.msg .note{font-weight:500;color:var(--fg)}

/* ログイン */
.login{max-width:420px;width:100%;margin:24px auto 0}
.login label{display:grid;gap:6px;font-weight:700;font-size:14px}
#msg{margin:0;color:var(--bad);font-weight:700;min-height:1.5em}

/* ポイント使用(ティール) */
.hero{--c:var(--teal);background:var(--card);border:2px solid var(--teal);border-radius:var(--radius);padding:20px;display:grid;gap:14px}
.hero .title{color:var(--fg)} .hero .title svg{color:var(--teal)}
.steps{display:flex;gap:16px;font-size:13px;color:var(--muted);flex-wrap:wrap;margin:0;padding:0;list-style:none}
.steps .on{color:var(--teal);font-weight:800}
#code{font-size:30px;letter-spacing:.16em;min-height:72px;flex-basis:260px}
#code::placeholder{font-size:17px;letter-spacing:0}
#lookup{min-height:72px;font-size:22px;min-width:140px}
.confirm{display:grid;gap:12px;background:var(--teal-soft);border-radius:14px;padding:18px}
.member{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
#rMember{margin:0;font-size:22px;font-weight:800;overflow-wrap:anywhere}
#rMember .no{font-size:15px;font-weight:500;color:var(--muted);margin-left:4px}
.bal{color:var(--muted)}
#rAmount{margin:0;font-size:38px;font-weight:900;line-height:1.15}
#rAmount small{font-size:20px;font-weight:700;color:var(--muted)}
.actions{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center;margin-top:4px}
#cancelReq{min-height:52px;padding:0 20px;border:2px solid var(--line);background:var(--card);border-radius:14px;font-size:16px;font-weight:700;color:var(--muted)}
#confirm{min-height:76px;flex:1 1 240px;border:0;border-radius:14px;background:var(--ok);color:#fff;font-size:24px;font-weight:900}
.done{align-items:center}
#rDone{font-size:22px;font-weight:900}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px 16px 16px;display:grid;justify-items:center;align-content:start;gap:8px;text-align:center;min-height:180px}
.card svg{width:56px;height:56px;color:var(--c)}
.card h2{font-size:21px}
.card .pill{background:var(--c-soft);color:var(--c)}
.card .go{color:var(--muted);font-size:14px}
.card.c-purple{--c:var(--purple);--c-soft:var(--purple-soft)} .card.c-orange{--c:var(--orange);--c-soft:var(--orange-soft)} .card.c-blue{--c:var(--blue);--c-soft:var(--blue-soft)}

/* 会員(紫) */
.band{--c:var(--purple);background:var(--purple-soft);border:2px solid var(--purple);border-radius:var(--radius);padding:18px;display:grid;gap:12px}
.band .title{color:var(--purple)}
#count{background:var(--card);color:var(--purple);border:1.5px solid var(--purple)}
.list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto auto;align-items:center;gap:12px;min-height:60px;padding:8px 16px;background:var(--card);border:1px solid var(--line);border-radius:14px;font-size:16px;text-align:left;width:100%}
.row .no,.row .time{color:var(--muted)} .row .nm{font-weight:700;overflow-wrap:anywhere} .row .pt{font-weight:700}
.rank{font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--purple-soft);color:var(--purple);letter-spacing:.04em;white-space:nowrap}
.row .arrow{color:var(--muted);font-size:20px}
.row.static{grid-template-columns:auto auto minmax(0,1fr)}
.detail{--c:var(--purple);border-color:var(--purple);border-width:2px}
.detail h2{font-size:22px;overflow-wrap:anywhere}
.detail h2 .no{font-size:15px;font-weight:500;color:var(--muted)}
#detail{margin:0;font-size:16px}
.detail h3{font-size:15px;color:var(--muted)}
#ledger li{display:grid;grid-template-columns:7.5em 5.5em 1fr;align-items:center;gap:6px 12px;padding:10px 14px;border:1px solid var(--line);border-radius:10px}
.tag{font-size:12px;font-weight:800;padding:3px 8px;border-radius:999px;text-align:center;white-space:nowrap;background:#eef1f5;color:var(--muted)}
.tag.t-earn{background:var(--ok-soft);color:var(--ok)} .tag.t-redeem{background:var(--teal-soft);color:var(--teal)} .tag.t-adjust{background:var(--purple-soft);color:var(--purple)}
.delta{font-weight:800} .plus{color:var(--ok)} .minus{color:var(--bad)}
#ledger .meta{color:var(--muted);font-size:13px}
#ledger .why{grid-column:1/-1;color:var(--fg);font-size:14px}
.adjust{border-top:1px dashed var(--line);padding-top:14px;display:grid;gap:10px}
.adjust .input{flex:1 1 140px;font-size:16px}
.adjust #adjReason{flex:2 1 220px}
#adjOut{margin:0;font-weight:700}

/* 本日の来店(オレンジ) / 集計(青) */
.c-orange-text{color:var(--orange)} .c-blue-text{color:var(--blue)}
.state{display:inline-flex;align-items:center;gap:8px;padding:5px 14px;border-radius:999px;font-weight:800}
.state i{width:10px;height:10px;border-radius:50%;background:currentColor}
.state.ok{background:var(--ok-soft);color:var(--ok)} .state.warn{background:var(--warn-soft);color:var(--warn)} .state.bad{background:var(--bad-soft);color:var(--bad)} .state.unknown{background:#eef1f5;color:var(--muted)}
.alerts{display:grid;gap:10px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:grid;gap:2px}
.stat .k{font-size:13px;color:var(--muted);font-weight:700}
.stat .v{font-size:32px;font-weight:900;line-height:1.15;overflow-wrap:anywhere}
.stat .v small{font-size:14px;font-weight:700;color:var(--muted);margin-left:4px}
.stat.t .v{color:var(--teal)} .stat.p .v{color:var(--purple)} .stat.o .v{color:var(--orange)} .stat.b .v{color:var(--blue)}
.facts{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}
.facts dt{color:var(--muted)} .facts dd{margin:0}
details summary{cursor:pointer;color:var(--muted);font-weight:700;min-height:44px;display:flex;align-items:center}
#dash{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;background:#f5f7fa;border-radius:10px;padding:12px}
#exportBox{--c:var(--blue);border-color:var(--blue)}
#exportOut{margin:0;font-weight:700}

@media (max-width:760px){
  .cards{grid-template-columns:1fr}
  .card{min-height:0;grid-template-columns:auto 1fr auto;justify-items:start;align-items:center;text-align:left;padding:14px 16px}
  .card svg{width:40px;height:40px;grid-row:span 2}
  .card .pill{grid-column:3;grid-row:1}
  .card .go{grid-column:2/-1}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat .v{font-size:26px}
  .title{font-size:22px}
  #code{font-size:26px}
  #lookup{width:100%}
  #rAmount{font-size:32px}
  .row{grid-template-columns:minmax(0,1fr) auto auto;gap:4px 10px}
  .row .no{grid-column:1/-1;font-size:13px}
  .row .arrow{display:none}
  #ledger li{grid-template-columns:auto 1fr}
  #ledger .meta{grid-column:1/-1}
}
</style></head>
<body>
<header class="topbar"><img class="logo" src="assets/logo.png" alt="10ZEN"><span id="who"></span> <button id="logout" class="btn-ghost" hidden>ログアウト</button></header>
<nav id="nav" hidden aria-label="機能">
  <button data-tab="redeem">ポイント使用</button> <button data-tab="members">会員</button> <button data-tab="today">本日の来店</button>
  <button data-tab="dash">集計</button>
</nav>
<main id="app"></main>
<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script type="module">
import { createStaffClient, redeemReduce, redeemInitial } from "../app-core/staff-client.mjs";
const cfg = window.APP_CONFIG, app = document.getElementById("app");
const el = (tag, text, attrs = {}) => { const e = document.createElement(tag); if (text !== undefined && text !== null) e.textContent = text; for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); return e; };
const put = (parent, ...kids) => { parent.append(...kids); return parent; };
const sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey);
const staff = createStaffClient({ supabase: sb, qrEndpoint: cfg.staffQrApi });
let role = null;
const show = (...n) => app.replaceChildren(...n);

// ---- 表示の小道具 ----
const DASH = "—";                                                          // 未取得は「—」(0 で埋めない)
const n = (v) => (typeof v === "number" && Number.isFinite(v) ? v.toLocaleString("ja-JP") : DASH);
const rankLabel = (c) => (c ? String(c).replace(/_/g, " ").toUpperCase() : DASH);
const jst = (iso, withTime = true) => {
  if (!iso) return null; const d = new Date(iso); if (Number.isNaN(d.getTime())) return null;
  const p = Object.fromEntries(new Intl.DateTimeFormat("ja-JP", { timeZone: "Asia/Tokyo", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).formatToParts(d).map((x) => [x.type, x.value]));
  return withTime ? `${p.year}-${p.month}-${p.day} ${p.hour}:${p.minute}` : `${p.year}-${p.month}-${p.day}`;
};
const hhmm = (iso) => (jst(iso) ? jst(iso).slice(11) : DASH);
const SVGNS = "http://www.w3.org/2000/svg";
const ICONS = {
  redeem: [["rect", { x: 4, y: 3, width: 16, height: 18, rx: 2 }], ["path", { d: "M9 3v2h6V3" }], ["path", { d: "m8.5 13 2.5 2.5 4.5-5" }]],
  members: [["circle", { cx: 9, cy: 8, r: 3.5 }], ["path", { d: "M2.5 20a6.5 6.5 0 0 1 13 0" }], ["circle", { cx: 17, cy: 9, r: 2.5 }], ["path", { d: "M15.5 14.5A5 5 0 0 1 22 19" }]],
  today: [["path", { d: "M4 21V5a2 2 0 0 1 2-2h7v18" }], ["path", { d: "M13 21h7V9h-7" }], ["path", { d: "M9 12h1" }]],
  dash: [["path", { d: "M4 20h16" }], ["rect", { x: 5, y: 11, width: 3.5, height: 7, rx: 1 }], ["rect", { x: 10.25, y: 6, width: 3.5, height: 12, rx: 1 }], ["rect", { x: 15.5, y: 9, width: 3.5, height: 9, rx: 1 }]],
};
function icon(name) {
  const s = document.createElementNS(SVGNS, "svg");
  for (const [k, v] of Object.entries({ viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", "stroke-width": 1.8, "stroke-linecap": "round", "stroke-linejoin": "round", "aria-hidden": "true" })) s.setAttribute(k, v);
  for (const [tag, attrs] of ICONS[name]) { const c = document.createElementNS(SVGNS, tag); for (const [k, v] of Object.entries(attrs)) c.setAttribute(k, v); s.append(c); }
  return s;
}
const title = (name, text, cls = "") => put(el("h1", undefined, { class: `title ${cls}` }), icon(name), document.createTextNode(text));
// 結果の表示(色・アイコン・文言)。文言は id つきの <p> に入れる
const MARK = { ok: "✓", warn: "⚠", bad: "✕", info: "…" };
function msgBox(kind, text, id, note) {
  const p = el("p", text, id ? { id } : {}); if (note) p.append(" ", el("span", note, { class: "note" }));
  return put(el("div", undefined, { class: `msg ${kind}`, role: kind === "bad" || kind === "warn" ? "alert" : "status" }), el("span", MARK[kind], { class: "ic", "aria-hidden": "true" }), p);
}
function failView(text, retry) {
  const b = el("button", "もう一度読み込む", { class: "btn sub", id: "retry" }); b.onclick = retry;
  return put(el("div", undefined, { class: "panel" }), msgBox("bad", text), b);
}

// ---- ログイン ----
async function start() {
  const w = await staff.whoami();
  if (w.kind !== "ok" || !w.data.active) return loginView(w.kind === "ok" ? "このアカウントにはスタッフ権限がありません" : null);
  if (w.data.role === "kiosk") { await staff.signOut(); return loginView("このアカウントは店頭QR専用です。スタッフ用のアカウントでログインしてください"); }   // 店頭タブレットのアカウントでは管理画面に入れない
  role = w.data.role; document.getElementById("who").textContent = `${w.data.displayName}(${role})`;
  document.getElementById("nav").hidden = false; document.getElementById("logout").hidden = false; tab("redeem");
}
function loginView(msg) {
  document.getElementById("nav").hidden = true; document.getElementById("logout").hidden = true; document.getElementById("who").textContent = "";
  const e = el("input", undefined, { id: "email", type: "email", autocomplete: "username", class: "input" }), p = el("input", undefined, { id: "password", type: "password", autocomplete: "current-password", class: "input" });
  const b = el("button", "ログイン", { id: "login", class: "btn" });
  const m = el("p", msg || "", { id: "msg", role: "alert" });
  const go = async () => { b.disabled = true; m.textContent = ""; const r = await staff.signIn(e.value, p.value); b.disabled = false; if (r.kind !== "ok") { m.textContent = "ログインできませんでした"; return; } start(); };
  b.onclick = go; p.onkeydown = (ev) => { if (ev.key === "Enter") go(); };
  const box = put(el("div", undefined, { class: "panel login" }), el("h2", "スタッフログイン"),
    put(el("label", "メールアドレス"), e), put(el("label", "パスワード"), p), b, m);
  show(box);
}
document.getElementById("logout").onclick = async () => { await staff.signOut(); loginView(); };
document.getElementById("nav").onclick = (ev) => { const t = ev.target.closest?.("[data-tab]")?.dataset.tab; if (t) tab(t); };
function tab(t) {
  for (const b of document.querySelectorAll("#nav [data-tab]")) { if (b.dataset.tab === t) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); }
  window.scrollTo(0, 0);
  ({ redeem: redeemView, members: membersView, today: todayView, dash: dashView })[t]();
}

// ---- ポイント使用(ログイン直後の画面: 最上段にコード入力、下に3つの入口) ----
function redeemView() {
  let st = redeemInitial;
  const code = el("input", undefined, { id: "code", class: "input num", inputmode: "numeric", maxlength: "7", autocomplete: "off", placeholder: "お客様のコード(6桁)", "aria-label": "お客様のコード(6桁)" });
  const go = el("button", "確認 →", { id: "lookup", class: "btn" }), out = el("div", undefined, { id: "redeemOut" });
  const stepsEl = el("ol", undefined, { class: "steps", "aria-label": "手順" });
  const STEPS = ["① コードを入力", "② 内容を確認", "③ 確定"];
  const render = () => {
    const at = st.step === "confirm" || st.step === "confirming" ? 1 : st.step === "done" ? 2 : 0;
    stepsEl.replaceChildren(...STEPS.map((s, i) => el("li", s, i === at ? { class: "on", "aria-current": "step" } : {})));
    go.disabled = st.step === "looking_up" || st.step === "confirming";
    out.replaceChildren();
    const say = (kind, t, id) => out.append(msgBox(kind, t, id || "redeemMsg"));
    if (st.step === "confirm" || st.step === "confirming") {
      const who = put(el("p", undefined, { id: "rMember" }), el("span", st.member.displayName ?? "会員", { class: "name" }), el("span", `(${st.member.memberNo})`, { class: "no" }));
      const amount = put(el("p", undefined, { id: "rAmount", class: "num" }), document.createTextNode(`使用 ${st.request.points}pt`), el("small", ` = ${st.request.yen}円`));
      const c = el("button", st.step === "confirming" ? "確定しています…" : "✓ 確定する", { id: "confirm" }); c.disabled = st.step === "confirming";
      c.onclick = async () => { st = redeemReduce(st, { type: "confirm_start" }); render(); st = redeemReduce(st, { type: "confirm_result", result: await staff.confirmRedeem(st.request.id) }); render(); };
      const x = el("button", "取消", { id: "cancelReq" }); x.disabled = st.step === "confirming";
      x.onclick = async () => { await staff.cancelRedeem(st.request.id); st = redeemInitial; render(); };
      out.append(put(el("div", undefined, { class: "confirm" }),
        put(el("div", undefined, { class: "member" }), who, el("span", `残高 ${n(st.member.points)}pt`, { class: "bal num" })),
        amount, put(el("div", undefined, { class: "actions" }), x, c)));
    } else if (st.step === "looking_up") say("info", "確認しています…", "redeemBusy");     // 結果の表示(#redeemMsg)とは別の id

// ---- 会員(紫) ----

const LEDGER = (l) => l.type === "earn" ? (l.rule === "visit" ? "付与(来店)" : l.rule === "welcome" ? "付与(登録)" : "付与")

// ---- 集計(青) ----

  const reload = el("button", "更新", { class: "btn sub", id: "reloadDash", style: "--c:var(--blue)" }); reload.onclick = dashView;
  const head = put(el("div", undefined, { class: "head" }), title("dash", "集計", "c-blue-text"));

  const facts = put(el("dl", undefined, { class: "facts num" }), el("dt", "最終バックアップ"), el("dd", jst(d.lastBackupAt) ?? DASH), el("dt", "移行残高の照合"), el("dd", d.reconciled === true ? "済み" : d.reconciled === false ? "未完了" : DASH));

// ---- 分析用の CSV 出力(店長のみ・既存の API の範囲・出力した時点のデータ) ----
const csvCell = (v) => { if (v === null || v === undefined) return ""; let s = String(v); if (typeof v === "string" && /^[=+\-@\t\r]/.test(s)) s = "'" + s; return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
const toCsv = (rows) => "﻿" + rows.map((r) => r.map(csvCell).join(",")).join("\r\n") + "\r\n";
const stamp = () => jst(new Date().toISOString()).replace(/[-: ]/g, "").replace(/^(\d{8})(\d{4})$/, "$1-$2");
function download(name, text) {
  const url = URL.createObjectURL(new Blob([text], { type: "text/csv;charset=utf-8" }));
  const a = el("a", undefined, { href: url, download: name }); document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 10_000);

      [jst(d.asOf), d.state, yn(d.reconciled), d.membersActive, d.visitsToday, d.pointsIssuedThisMonth, d.pointsRedeemedThisMonth, d.pendingRedeems, jst(d.lastBackupAt), yn(d.backupStale), Array.isArray(d.undecidedPolicies) ? d.undecidedPolicies.join(" ") : "", d.balanceMismatches]];

    const startedAt = jst(new Date().toISOString());
    const head = ["会員番号", "会員の状態", "登録日", "最終の来店・利用日", "残高pt", "ランク", "累計付与pt(確認済みのみ。未確認は空欄)", "付与件数(登録)", "付与件数(来店)", "付与件数(その他)", "付与pt合計",
      "使用件数", "使用pt合計", "調整件数", "調整pt合計", "来店ポイント付与日(台帳より。来店記録そのものではない)", "台帳が100件以上(集計は直近100件のみ・不完全)", "詳細の取得", "出力開始の時点"];
    const rows = [head]; let failed = 0;

}
