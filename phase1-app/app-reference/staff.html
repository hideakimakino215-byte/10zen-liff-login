<!doctype html>
<!-- スタッフ画面(B案: 白地+機能ごとの色。ティール=ポイント使用・紫=会員・オレンジ=本日の来店・青=集計。成功=緑/注意=オレンジ/失敗=赤)。
     権限の判定は DB の関数側(画面の出し分けは補助)。描画は textContent のみ(innerHTML は使わない)。外部の CDN・フォントは使わない。
     体質チェックの五行の色は app-core/constitution.mjs の ELEMENT_COLORS など(ここに色の値を書かない)。会員の体質(db/104)は店長・スタッフだけ。
     目標と KPI(紺。db/105)は店長・閲覧(本部)だけ: タブ・ホームのカードはスタッフには DOM ごと出さない。変更(本番開始日・目標・レジの客数の取り込み)は店長だけ。 -->
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>10ZEN スタッフ</title>
<style>
:root{
  --bg:#f3f5f8; --card:#fff; --fg:#1c2430; --muted:#5b6675; --line:#e3e7ee;
  --teal:#0f9d8f; --teal-soft:#e3f5f2; --purple:#7a5af5; --purple-soft:#eee9fe;
  --orange:#d9670f; --orange-soft:#fff0e2; --blue:#2f7fe0; --blue-soft:#e6f0fc; --sage:#4f7d3a; --sage-soft:#edf4e6; --navy:#3b4a8f; --navy-soft:#e9ecf8;
  --ok:#1f8a4c; --ok-soft:#e4f6ea; --warn:#c75f0e; --warn-soft:#fff1e3; --bad:#c93a3a; --bad-soft:#fde8e8;
  --radius:16px; color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.55;cursor:default}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}

/* 上部: ロゴ・ログイン中・ログアウト */
.topbar{background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:12px;padding-top:max(10px,env(safe-area-inset-top))}
.logo{height:36px;width:auto;display:block}
#who{margin-left:auto;color:var(--muted);font-size:14px;min-width:0;overflow-wrap:anywhere;text-align:right}
.btn-ghost{min-height:44px;padding:0 16px;border:1.5px solid var(--line);background:var(--card);border-radius:12px;font-weight:700;font-size:14px;white-space:nowrap}

/* タブ(機能ごとの色) */
#nav{background:var(--card);border-bottom:1px solid var(--line);display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);padding:0 8px}
#nav button{min-height:48px;border:0;background:none;font-weight:700;font-size:14px;color:var(--muted);border-bottom:3px solid transparent;padding:4px 2px;line-height:1.25}
#nav button[data-tab=redeem]{--c:var(--teal)} #nav button[data-tab=members]{--c:var(--purple)} #nav button[data-tab=dash]{--c:var(--blue)} #nav button[data-tab=constitution]{--c:var(--sage)} #nav button[data-tab=kpi]{--c:var(--navy)}
#nav button[aria-current=page]{color:var(--c);border-bottom-color:var(--c)}

main{max-width:1080px;margin:0 auto;padding:20px 16px 40px;display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
h1,h2,h3{margin:0}
.title{display:flex;align-items:center;gap:10px;font-size:26px;line-height:1.2}
.title svg{width:30px;height:30px;flex:none}
.muted{color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;display:grid;gap:14px}
.row-flex{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.asof{margin-left:auto;color:var(--muted);font-size:13px}
.pill{font-size:13px;font-weight:800;padding:4px 12px;border-radius:999px;background:#eef1f5;color:var(--muted);white-space:nowrap}
.input{flex:1 1 220px;min-width:0;width:100%;min-height:60px;border:2px solid var(--line);border-radius:14px;padding:0 16px;font-size:18px;background:var(--card)}
.input:focus{border-color:var(--c,var(--teal));outline:none}
.btn{min-height:60px;padding:0 24px;border:0;border-radius:14px;background:var(--c,var(--teal));color:#fff;font-size:18px;font-weight:800;white-space:nowrap}
.btn.sub{min-height:44px;font-size:15px;padding:0 16px;background:var(--card);color:var(--c,var(--teal));border:2px solid var(--c,var(--teal))}

/* 結果の表示: 色・アイコン・文言の3点セット */
.msg{display:flex;align-items:flex-start;gap:10px;border-radius:14px;padding:14px 16px;border:2px solid;font-weight:700}
.msg .ic{flex:none;font-weight:900}
.msg p{margin:0}
.msg.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.msg.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.msg.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.msg.info{background:#f5f7fa;border-color:var(--line);color:var(--muted)}
.msg .note{font-weight:500;color:var(--fg)}

/* ログイン */
.login{max-width:420px;width:100%;margin:24px auto 0}
.login label{display:grid;gap:6px;font-weight:700;font-size:14px}
#msg{margin:0;color:var(--bad);font-weight:700;min-height:1.5em}

/* ポイント使用(ティール) */
.hero{--c:var(--teal);background:var(--card);border:2px solid var(--teal);border-radius:var(--radius);padding:20px;display:grid;gap:14px}
.hero .title{color:var(--fg)} .hero .title svg{color:var(--teal)}
.steps{display:flex;gap:16px;font-size:13px;color:var(--muted);flex-wrap:wrap;margin:0;padding:0;list-style:none}
.steps .on{color:var(--teal);font-weight:800}
#code{font-size:30px;letter-spacing:.16em;min-height:72px;flex-basis:260px}
#code::placeholder{font-size:17px;letter-spacing:0}
#lookup{min-height:72px;font-size:22px;min-width:140px}
.confirm{display:grid;gap:12px;background:var(--teal-soft);border-radius:14px;padding:18px}
.member{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
#rMember{margin:0;font-size:22px;font-weight:800;overflow-wrap:anywhere}
#rMember .no{font-size:15px;font-weight:500;color:var(--muted);margin-left:4px}
.bal{color:var(--muted)}
#rAmount{margin:0;font-size:38px;font-weight:900;line-height:1.15}
#rAmount small{font-size:20px;font-weight:700;color:var(--muted)}
#rTicket{margin:0;font-size:26px;font-weight:900;line-height:1.3;overflow-wrap:anywhere;display:flex;gap:10px;align-items:flex-start}
#rTicket svg{width:30px;height:30px;flex:none;color:var(--teal);margin-top:2px}
#rTicket small{display:block;font-size:15px;font-weight:700;color:var(--muted);margin-top:4px}
.stats.three{grid-template-columns:repeat(3,minmax(0,1fr))}
#ticketStats{display:grid;gap:10px}
#ticketStats h2{font-size:17px;display:flex;align-items:center;gap:8px;color:var(--teal)}
#ticketStats h2 svg{width:24px;height:24px}
.actions{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center;margin-top:4px}
#cancelReq{min-height:52px;padding:0 20px;border:2px solid var(--line);background:var(--card);border-radius:14px;font-size:16px;font-weight:700;color:var(--muted)}
#confirm{min-height:76px;flex:1 1 240px;border:0;border-radius:14px;background:var(--ok);color:#fff;font-size:24px;font-weight:900}
.done{align-items:center}
#rDone{font-size:22px;font-weight:900}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px 16px 16px;display:grid;justify-items:center;align-content:start;gap:8px;text-align:center;min-height:180px}
.card svg{width:56px;height:56px;color:var(--c)}
.card h2{font-size:21px}
.card .pill{background:var(--c-soft);color:var(--c)}
.card .go{color:var(--muted);font-size:14px}
.card.c-purple{--c:var(--purple);--c-soft:var(--purple-soft)} .card.c-blue{--c:var(--blue);--c-soft:var(--blue-soft)} .card.c-sage{--c:var(--sage);--c-soft:var(--sage-soft)} .card.c-navy{--c:var(--navy);--c-soft:var(--navy-soft)}

/* 会員(紫) */
.band{--c:var(--purple);background:var(--purple-soft);border:2px solid var(--purple);border-radius:var(--radius);padding:18px;display:grid;gap:12px}
.band .title{color:var(--purple)}
#count{background:var(--card);color:var(--purple);border:1.5px solid var(--purple)}
.list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto auto;align-items:center;gap:12px;min-height:60px;padding:8px 16px;background:var(--card);border:1px solid var(--line);border-radius:14px;font-size:16px;text-align:left;width:100%}
.row .no,.row .time{color:var(--muted)} .row .nm{font-weight:700;overflow-wrap:anywhere} .row .pt{font-weight:700}
.rank{display:inline-block;font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;letter-spacing:.06em;white-space:nowrap;color:#fff;border:1px solid rgba(0,0,0,.08);background:#eef1f5}
.rank.r-white_opal{color:#4a4843;background:linear-gradient(135deg,#f6f5f1,#d8d5cc);border-color:#cfcabd}
.rank.r-amber{background:linear-gradient(135deg,#f3c27a,#b45309)} .rank.r-emerald{background:linear-gradient(135deg,#5fbf97,#064e3b)} .rank.r-ruby{background:linear-gradient(135deg,#e07a9e,#831843)}
.rank.r-onyx{color:#d4af37;background:linear-gradient(135deg,#2a3142,#0b1220);border-color:#d4af37}
.row .arrow{color:var(--muted);font-size:20px}
.detail{--c:var(--purple);border-color:var(--purple);border-width:2px}
.detail h2{font-size:22px;overflow-wrap:anywhere}
.detail h2 .no{font-size:15px;font-weight:500;color:var(--muted)}
#detail{margin:0;font-size:16px}
.detail h3{font-size:15px;color:var(--muted)}
#ledger li{display:grid;grid-template-columns:7.5em 5.5em 1fr;align-items:center;gap:6px 12px;padding:10px 14px;border:1px solid var(--line);border-radius:10px}
.tag{font-size:12px;font-weight:800;padding:3px 8px;border-radius:999px;text-align:center;white-space:nowrap;background:#eef1f5;color:var(--muted)}
.tag.t-earn{background:var(--ok-soft);color:var(--ok)} .tag.t-redeem{background:var(--teal-soft);color:var(--teal)} .tag.t-adjust{background:var(--purple-soft);color:var(--purple)}
.delta{font-weight:800} .plus{color:var(--ok)} .minus{color:var(--bad)}
#ledger .meta{color:var(--muted);font-size:13px}
#ledger .why{grid-column:1/-1;color:var(--fg);font-size:14px}
.adjust{border-top:1px dashed var(--line);padding-top:14px;display:grid;gap:10px}
.adjust .input{flex:1 1 140px;font-size:16px}
.adjust #adjReason{flex:2 1 220px}
#adjOut{margin:0;font-weight:700}

/* 本日の来店(オレンジ) / 集計(青) */
.c-blue-text{color:var(--blue)}
.state{display:inline-flex;align-items:center;gap:8px;padding:5px 14px;border-radius:999px;font-weight:800}
.state i{width:10px;height:10px;border-radius:50%;background:currentColor}
.state.ok{background:var(--ok-soft);color:var(--ok)} .state.warn{background:var(--warn-soft);color:var(--warn)} .state.bad{background:var(--bad-soft);color:var(--bad)} .state.unknown{background:#eef1f5;color:var(--muted)}
.alerts{display:grid;gap:10px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:grid;gap:2px}
.stat .k{font-size:13px;color:var(--muted);font-weight:700}
.stat .v{font-size:32px;font-weight:900;line-height:1.15;overflow-wrap:anywhere}
.stat .v small{font-size:14px;font-weight:700;color:var(--muted);margin-left:4px}
.stat.t .v{color:var(--teal)} .stat.p .v{color:var(--purple)} .stat.o .v{color:var(--orange)} .stat.b .v{color:var(--blue)}
#exportBox{--c:var(--blue);border-color:var(--blue)}
#exportOut{margin:0;font-weight:700}

/* 体質チェック(セージ) */
.c-sage-text{color:var(--sage)}
.stat.g .v{color:var(--sage)}
.cc-sec{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;display:grid;gap:12px}
.cc-sec h2{font-size:17px;color:var(--sage)}
.cc-sec h3{font-size:14px;color:var(--muted);margin:0 0 6px}
.cc-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.bars{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.bars li{display:grid;grid-template-columns:9.5em minmax(0,1fr) 3.5em;gap:10px;align-items:center;font-size:14px}
.bars .track{height:12px;background:#eef1f5;border-radius:999px;overflow:hidden}
.bars .track i{display:block;height:100%;background:var(--sage);border-radius:999px}
/* 五行の色は app-core/constitution.mjs の ELEMENT_COLORS(棒ごとに style で入れる)。どの五行でもないもの(バランス良好・ふつう など)は灰色の斜線(金の銀灰色と区別) */
.bars .track i.neutral{background:#dde1e7}   /* 実際の斜線は NEUTRAL_COLOR から(スクリプト) */
.bars .cnt{text-align:right;font-weight:800}
.bars .lbl{overflow-wrap:anywhere}
.bars .lbl b{font-weight:800}
.radar{display:block;width:100%;max-width:300px;height:auto;margin:0 auto}
.radar-ring,.radar-axis{fill:none;stroke:var(--line);stroke-width:1}
.radar-area{fill:rgba(91,102,117,.13);stroke:#7d8794;stroke-width:2;stroke-linejoin:round}   /* 面は無彩色。点と軸の名前を五行の色にする */
.radar-dot{fill:var(--sage)}
/* 体質のタイプの印(五行の色。文字は濃いめの同系色) */
.cc-chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;padding:2px 9px;border-radius:999px;border:1.5px solid #b8bfc8;background:#f1f3f6;color:var(--muted);white-space:nowrap;line-height:1.5;vertical-align:middle}
.cc-chip.big{font-size:15px;padding:4px 12px}
.row .nm .cc-chip{margin-left:8px}
.cc-member{border-top:1px dashed var(--line);padding-top:14px;display:grid;grid-template-columns:minmax(0,1fr) 168px;gap:6px 16px;align-items:center}
.cc-member h3{grid-column:1/-1}
.cc-member .cc-info{display:grid;gap:8px;justify-items:start}
.cc-member p{margin:0;font-size:15px;overflow-wrap:anywhere}
.cc-member .radar{max-width:168px}
.cc-member .radar-label{font-size:17px}
.radar-label{font-size:15px;font-weight:700;fill:var(--fg)}
.radar-value{font-size:12px;font-weight:500;fill:var(--muted)}
.cmp{width:100%;border-collapse:collapse;font-size:15px}
.cmp th,.cmp td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:right}
.cmp th:first-child,.cmp td:first-child{text-align:left}
.cmp th{font-size:13px;color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.week .bars li{grid-template-columns:9em minmax(0,1fr) 2.5em}

/* 目標と KPI(紺)。達成の色は状態の色(緑=達成・オレンジ=80〜99%・赤=80%未満・灰色=目標なし)を、アイコンと文字と一緒に使う */
.c-navy-text{color:var(--navy)}
.kpi-lead{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:14px;color:var(--muted);margin:0}
.kpi-lead b{color:var(--fg)}
.kpi-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
/* KPI のカードは、KPI ごとに色を分ける(達成の状況は色ではなく、カードの中の札で示す) */
.kpi-card{--kc:var(--navy);--kc-soft:var(--navy-soft);background:linear-gradient(var(--kc-soft),var(--card) 64px);border:1px solid var(--line);border-top:6px solid var(--kc);border-radius:var(--radius);padding:14px 16px;display:grid;gap:6px;align-content:start;min-width:0}
#kpiCard-member_visit_rate{--kc:var(--purple);--kc-soft:var(--purple-soft)} #kpiCard-check_rate{--kc:var(--sage);--kc-soft:var(--sage-soft)}
#kpiCard-revisit_rate{--kc:var(--blue);--kc-soft:var(--blue-soft)} #kpiCard-referral_clicks{--kc:#8a6a3b;--kc-soft:#f5eee2}
.kpi-card h2{font-size:15px;margin:0;color:var(--kc)}
.kpi-card .v{font-size:32px;font-weight:900;line-height:1.15;overflow-wrap:anywhere}
.kpi-card .v.missing{font-size:16px;font-weight:800;color:var(--warn);line-height:1.4}
.kpi-card .tg,.kpi-card .sub{font-size:13px;color:var(--muted);margin:0;overflow-wrap:anywhere}
.kpi-card .sub b{color:var(--fg)}
.st{display:inline-flex;align-items:center;gap:6px;justify-self:start;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:800;background:#eef1f5;color:var(--muted);white-space:nowrap}
.st.ok{background:var(--ok-soft);color:var(--ok)} .st.warn{background:var(--warn-soft);color:var(--warn)} .st.bad{background:var(--bad-soft);color:var(--bad)}
.kpi-sec{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px;min-width:0}
.kpi-sec .msg p{overflow-wrap:anywhere;min-width:0}
.kpi-sec h2{font-size:17px;color:var(--navy);margin:0}
.kpi-sec h3{font-size:14px;color:var(--muted);margin:0}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
.kpi-table{min-width:720px}
.kpi-table td.miss{color:var(--warn);font-weight:700;font-size:13px}
.kpi-table td small{display:block;color:var(--muted);font-size:12px;font-weight:500}
.kpi-table tr.cur td{background:var(--navy-soft)}
.chart{display:block;width:100%;height:auto}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{font-size:12px;fill:var(--muted)}
.chart .act{fill:none;stroke:var(--navy);stroke-width:2;stroke-linejoin:round}
.chart .tgt{fill:none;stroke:#7d8794;stroke-width:2;stroke-dasharray:6 5}
.chart .dot{fill:var(--navy);stroke:var(--card);stroke-width:2}
.chart .hit{fill:transparent}
.chart .lbl{font-size:12px;font-weight:700;fill:var(--fg)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:0;padding:0;list-style:none}
.legend li{display:flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:22px;height:0;border-top:2px solid var(--navy)} .legend i.t{border-top:2px dashed #7d8794}
.admin{--c:var(--navy);border:2px solid var(--navy)}
.kpi-form{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.kpi-form .input{min-height:48px;font-size:16px;flex:0 1 220px}
.kpi-form .btn{min-height:48px;font-size:16px}
.kpi-sec .btn{white-space:normal;line-height:1.3;max-width:100%}
.kpi-sec input[type=file]{max-width:100%;font-size:15px}
.targets{min-width:420px} .targets td:first-child{min-width:9em} .targets td{padding:6px 4px} .targets input{width:5.5em;min-height:44px;border:2px solid var(--line);border-radius:10px;padding:0 8px;font-size:16px;text-align:right}
.targets th:first-child,.targets td:first-child{text-align:left}
.out{margin:0;font-weight:700}
.out.ok{color:var(--ok)} .out.bad{color:var(--bad)} .out.warn{color:var(--warn)}
.pick{display:flex;gap:12px;flex-wrap:wrap;font-size:14px}
.pick label{display:grid;gap:4px;font-weight:700}
.pick select{min-height:44px;border:2px solid var(--line);border-radius:10px;padding:0 8px;font-size:15px;max-width:16em;background:var(--card)}
.outliers{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.outliers label{display:flex;gap:10px;align-items:center;min-height:44px;padding:4px 10px;border:1px solid var(--line);border-radius:10px;font-size:15px}
.outliers input{width:22px;height:22px}
.skipped{margin:0;padding-left:1.2em;font-size:13px;color:var(--muted)}

@media (max-width:760px){
  .kpi-cards{grid-template-columns:minmax(0,1fr)}
  .cards{grid-template-columns:1fr}
  .cc-grid,.week{grid-template-columns:1fr}
  .cc-member{grid-template-columns:minmax(0,1fr)}
  .cc-member .radar{max-width:168px}
  .cc-chip.big{white-space:normal}
  .card{min-height:0;grid-template-columns:auto 1fr auto;justify-items:start;align-items:center;text-align:left;padding:14px 16px}
  .card svg{width:40px;height:40px;grid-row:span 2}
  .card .pill{grid-column:3;grid-row:1}
  .card .go{grid-column:2/-1}
  .stats,.stats.three{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat .v{font-size:26px}
  .title{font-size:22px}
  #code{font-size:26px}
  #lookup{width:100%}
  #rAmount{font-size:32px}
  .row{grid-template-columns:minmax(0,1fr) auto auto;gap:4px 10px}
  .row .no{grid-column:1/-1;font-size:13px}
  .row .arrow{display:none}
  #ledger li{grid-template-columns:auto 1fr}
  #ledger .meta{grid-column:1/-1}
}

  <button data-tab="redeem">ポイント使用</button> <button data-tab="members">会員</button>
  <button data-tab="dash">集計</button> <button data-tab="constitution">体質チェック</button>
</nav>
<main id="app"></main>
<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script type="module">
import { createStaffClient, redeemReduce, redeemInitial } from "../app-core/staff-client.mjs";
import { ELEMENTS, ELEMENT_INFO, CONDITION_QUESTIONS, BALANCED_NAME, ELEMENT_COLORS, ELEMENT_TEXT_COLORS, ELEMENT_SOFT_COLORS, NEUTRAL_COLOR } from "../app-core/constitution.mjs";
import { radarSvg } from "../app-core/radar.mjs";
import { KPI_DEFS, KPI_BY_CODE, MILESTONES, statusOf, STATUS_LABELS, parseTargetInput, fmtValue, milestoneLabel } from "../app-core/kpi.mjs";
import { analyzePosFile, summarize, rowsForImport, SKIP_REASONS, ERRORS as POS_ERRORS, ENCODING_LABELS, OUTLIER_FACTOR } from "../app-core/pos-import.mjs";
const cfg = window.APP_CONFIG, app = document.getElementById("app");
const el = (tag, text, attrs = {}) => { const e = document.createElement(tag); if (text !== undefined && text !== null) e.textContent = text; for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); return e; };
const put = (parent, ...kids) => { parent.append(...kids); return parent; };
const sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey);
const staff = createStaffClient({ supabase: sb, qrEndpoint: cfg.staffQrApi });
let role = null;
const show = (...n) => app.replaceChildren(...n);

// ---- 表示の小道具 ----
const DASH = "—";                                                          // 未取得は「—」(0 で埋めない)
const n = (v) => (typeof v === "number" && Number.isFinite(v) ? v.toLocaleString("ja-JP") : DASH);
const rankLabel = (c) => (c ? String(c).replace(/_/g, " ").toUpperCase() : DASH);
const rankChip = (c) => el("span", rankLabel(c), { class: `rank r-${String(c || "").replace(/[^a-z_]/g, "")}` });   // 色は会員証と同じ
// 体質のタイプ(DB の staff_list_members / staff_member_detail の constitution。店長・スタッフにだけ返る)。c: { primary, balanced }
const isEl = (e) => ELEMENTS.includes(e);
const ccTypeText = (c) => (c?.balanced ? BALANCED_NAME : isEl(c?.primary) ? `${ELEMENT_INFO[c.primary].kanji} ${ELEMENT_INFO[c.primary].typeName}` : DASH);
// タイプの印(五行の色)。一覧は小さく五行の漢字だけ(バランス良好は「バランス」)、会員の詳細は大きくタイプ名まで
function ccChip(c, { big = false, id } = {}) {

    { class: `cc-chip${big ? " big" : ""}`, "data-element": e ?? "balanced", title: `体質: ${ccTypeText(c)}`, ...(big ? {} : { "aria-label": `体質: ${ccTypeText(c)}` }), ...(id ? { id } : {}) });

  else chip.style.borderColor = NEUTRAL_COLOR;                                     // バランス良好は灰色(文字は既定の濃い灰色)
  return chip;
}
const conditionText = (t) => CONDITION_QUESTIONS.map((q) => q.options.find((o) => o.value === t?.[q.key])?.short ?? DASH).join("・");
const jst = (iso, withTime = true) => {

  const p = Object.fromEntries(new Intl.DateTimeFormat("ja-JP", { timeZone: "Asia/Tokyo", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).formatToParts(d).map((x) => [x.type, x.value]));
  return withTime ? `${p.year}-${p.month}-${p.day} ${p.hour}:${p.minute}` : `${p.year}-${p.month}-${p.day}`;
};
const hhmm = (iso) => (jst(iso) ? jst(iso).slice(11) : DASH);
const SVGNS = "http://www.w3.org/2000/svg";
const ICONS = {
  redeem: [["rect", { x: 4, y: 3, width: 16, height: 18, rx: 2 }], ["path", { d: "M9 3v2h6V3" }], ["path", { d: "m8.5 13 2.5 2.5 4.5-5" }]],
  members: [["circle", { cx: 9, cy: 8, r: 3.5 }], ["path", { d: "M2.5 20a6.5 6.5 0 0 1 13 0" }], ["circle", { cx: 17, cy: 9, r: 2.5 }], ["path", { d: "M15.5 14.5A5 5 0 0 1 22 19" }]],
  dash: [["path", { d: "M4 20h16" }], ["rect", { x: 5, y: 11, width: 3.5, height: 7, rx: 1 }], ["rect", { x: 10.25, y: 6, width: 3.5, height: 12, rx: 1 }], ["rect", { x: 15.5, y: 9, width: 3.5, height: 9, rx: 1 }]],
  ticket: [["path", { d: "M3 8a2 2 0 0 0 2-2h14a2 2 0 0 0 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 0-2 2H5a2 2 0 0 0-2-2v-2a2 2 0 0 0 0-4z" }], ["path", { d: "M14 6v12", "stroke-dasharray": "2 2" }]],
  constitution: [["path", { d: "M12 3 20.5 9.2 17.3 19.2H6.7L3.5 9.2z" }], ["path", { d: "M12 7.5 16 10.6 14.5 15.5h-5L8 10.6z" }]],
  kpi: [["circle", { cx: 12, cy: 12, r: 8.5 }], ["circle", { cx: 12, cy: 12, r: 4.5 }], ["circle", { cx: 12, cy: 12, r: 1 }], ["path", { d: "M12 3.5V1.5M20.5 12h2" }]],
};
function icon(name) {

  for (const [k, v] of Object.entries({ viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", "stroke-width": 1.8, "stroke-linecap": "round", "stroke-linejoin": "round", "aria-hidden": "true" })) s.setAttribute(k, v);
  for (const [tag, attrs] of ICONS[name]) { const c = document.createElementNS(SVGNS, tag); for (const [k, v] of Object.entries(attrs)) c.setAttribute(k, v); s.append(c); }

// 結果の表示(色・アイコン・文言)。文言は id つきの <p> に入れる

  return put(el("div", undefined, { class: `msg ${kind}`, role: kind === "bad" || kind === "warn" ? "alert" : "status" }), el("span", MARK[kind], { class: "ic", "aria-hidden": "true" }), p);

// ---- ログイン ----

  if (w.data.role === "kiosk") { await staff.signOut(); return loginView("このアカウントは店頭QR専用です。スタッフ用のアカウントでログインしてください"); }   // 店頭タブレットのアカウントでは管理画面に入れない
  role = w.data.role; document.getElementById("who").textContent = `${w.data.displayName}(${role})`;
  // 目標と KPI のタブは店長・閲覧(本部)だけ。スタッフには DOM ごと出さない(権限の判定は DB の staff_kpi_overview)
  document.querySelector("#nav [data-tab=kpi]")?.remove();
  if (canSeeKpi()) document.getElementById("nav").append(el("button", "目標とKPI", { "data-tab": "kpi" }));
  document.getElementById("nav").hidden = false; document.getElementById("logout").hidden = false; tab("redeem");
}
const canSeeKpi = () => role === "manager" || role === "viewer";
function loginView(msg) {
  role = null; document.querySelector("#nav [data-tab=kpi]")?.remove();
  document.getElementById("nav").hidden = true; document.getElementById("logout").hidden = true; document.getElementById("who").textContent = "";
  const e = el("input", undefined, { id: "email", type: "email", autocomplete: "username", class: "input" }), p = el("input", undefined, { id: "password", type: "password", autocomplete: "current-password", class: "input" });

  const go = async () => { b.disabled = true; m.textContent = ""; const r = await staff.signIn(e.value, p.value); b.disabled = false; if (r.kind !== "ok") { m.textContent = "ログインできませんでした"; return; } start(); };

// ---- ポイント使用(ログイン直後の画面: 最上段にコード入力、下に会員・集計の入口) ----

      const who = put(el("p", undefined, { id: "rMember" }), el("span", st.member.displayName ?? "会員", { class: "name" }), el("span", `(${st.member.memberNo})`, { class: "no" }));
      const amount = ticket
        ? put(el("p", undefined, { id: "rTicket" }), icon("ticket"), put(el("span", `特典チケット: ${st.ticket?.title ?? DASH}`), el("small", `有効期限 ${st.ticket?.validThrough ?? DASH} まで`)))
        : put(el("p", undefined, { id: "rAmount", class: "num" }), document.createTextNode(`使用 ${st.request.points}pt`), el("small", ` = ${st.request.yen}円`));
      const c = el("button", st.step === "confirming" ? "確定しています…" : "✓ 確定する", { id: "confirm" }); c.disabled = st.step === "confirming";
      c.onclick = async () => { st = redeemReduce(st, { type: "confirm_start" }); render(); st = redeemReduce(st, { type: "confirm_result", result: await (ticket ? staff.confirmTicket(st.request.id) : staff.confirmRedeem(st.request.id)) }); render(); };
      const x = el("button", "取消", { id: "cancelReq" }); x.disabled = st.step === "confirming";
      x.onclick = async () => { await (ticket ? staff.cancelTicket(st.request.id) : staff.cancelRedeem(st.request.id)); st = redeemInitial; render(); };
      out.append(put(el("div", undefined, { class: "confirm" }),

    else if (st.step === "done" && st.kind === "ticket") { const b = msgBox("ok", `確定しました: ${st.title ?? "特典チケット"}`, "rDone", "商品をお渡しください"); b.classList.add("done"); out.append(b); }
    else if (st.step === "done") { const b = msgBox("ok", `確定しました: ${st.points}pt(${st.yen}円分)。残高 ${st.balanceAfter ?? DASH}pt`, "rDone"); b.classList.add("done"); out.append(b); }
    else if (st.step === "ticket_used") say("bad", "このチケットは使用済みです");
    else if (st.step === "ticket_expired") say("bad", "このチケットは有効期限が切れています");
    else if (st.step === "not_found") say("bad", "コードが見つかりません(期限切れの可能性があります)");
    else if (st.step === "expired") say("bad", "有効時間が過ぎました。お客様に再申請してもらってください");
    else if (st.step === "insufficient") say("bad", `残高が足りません(残高 ${n(st.balance)}pt)`);
    else if (st.step === "cancelled") say("warn", "お客様が取り消しました");
    else if (st.step === "locked") say("bad", "入力の間違いが続いたため、しばらく使えません");

  render();

  hero.firstChild.id = "redeemTitle";
  // 下の入口(会員・集計)。件数は集計から(取れなければ「—」)。本日の来店は集計にまとめた
  const pills = { members: el("span", `有効 ${DASH} 人`, { class: "pill num" }), dash: el("span", `来店 ${DASH} 人`, { class: "pill num" }),
    constitution: el("span", role === "staff" ? `今週の体調 ${DASH} 件` : `実施 ${DASH} 人`, { class: "pill num", id: "ccPill" }) };
  const card = (t, cls, name, h, go) => { const b = put(el("button", undefined, { class: `card ${cls}`, "data-go": t }), icon(name), el("h2", h), pills[t], el("span", `${go} ›`, { class: "go" })); b.onclick = () => tab(t); return b; };

  if (canSeeKpi()) {

// ---- 会員(紫) ----
async function membersView(query = "") {

  b.onclick = () => membersView(q.value); q.onkeydown = (ev) => { if (ev.key === "Enter") membersView(q.value); }; q.value = query;
  const band = put(el("section", undefined, { class: "band" }), put(el("div", undefined, { class: "head" }), title("members", "会員"), count), put(el("div", undefined, { class: "row-flex" }), q, b));

      const a = put(el("button", undefined, { "data-id": m.id, class: "row num" }), el("span", m.memberNo, { class: "no" }), nm,
        el("span", `${n(m.points)}pt`, { class: "pt" }), rankChip(m.rank), el("span", "›", { class: "arrow", "aria-hidden": "true" }));
      a.onclick = () => detailView(m.id, query); list.append(put(el("li"), a));
    }

    if (!r.data.total) list.append(put(el("li"), msgBox("info", query ? "該当する会員がいません" : "会員がいません")));

const LEDGER = (l) => l.type === "earn" ? (l.rule === "visit" ? "付与(来店)" : l.rule === "welcome" ? "付与(登録)" : "付与")
  : l.type === "redeem" ? "使用" : l.type === "adjust" ? "調整" : l.type === "opening_balance" ? "移行時の残高" : l.type === "expire" ? "失効" : l.type;
async function detailView(id, backQuery = "") {
  const back = el("button", "‹ 一覧へ戻る", { class: "btn-ghost", id: "back" }); back.onclick = () => membersView(backQuery);
  const r = await staff.memberDetail(id);
  if (r.kind !== "ok" || r.data.status !== "ok") return show(back, failView("取得できませんでした", () => detailView(id, backQuery)));
  const m = r.data.member, ul = el("ul", undefined, { id: "ledger", class: "list" });
  for (const l of r.data.ledger) {

// ---- 目標と KPI(紺)。店長・閲覧(本部)だけ(DB の staff_kpi_overview が判定)。変更の部品は店長だけ(閲覧には DOM ごと出さない) ----
//  上: 4つの KPI のカード(今月の実績・今の段階の目標・達成率・直近の推移)。中: 月ごとの表と会員来店率の線グラフ。下(店長のみ): 本番開始日・目標・レジの客数の取り込み・月の客数の手入力
const ST_MARK = { ok: "✓", warn: "⚠", bad: "✕", none: "—" };
const stChip = (status, text, id) => put(el("span", undefined, { class: `st ${status}`, ...(id ? { id } : {}) }), el("span", ST_MARK[status], { "aria-hidden": "true" }), document.createTextNode(text ?? STATUS_LABELS[status]));
const POS_MISSING = "レジの客数が未取り込み";
const jstTodayStr = () => jst(new Date().toISOString(), false);
const svg = (tag, attrs = {}, text) => { const e = document.createElementNS(SVGNS, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); if (text !== undefined) e.textContent = text; return e; };
// 会員来店率と目標の線グラフ(1つの軸・%)。目標は破線(段階ごとの値)。点にカーソル/タップで値
function visitRateChart(months, width = 640) {
  const W = Math.max(280, Math.round(width)), H = W < 500 ? 200 : 240, L = 40, R = 16, T = 16, B = 30, iw = W - L - R, ih = H - T - B;
  const act = months.map((m) => m.kpis.member_visit_rate.actual), tgt = months.map((m) => m.kpis.member_visit_rate.target);
  const max = Math.max(10, ...act.filter((v) => typeof v === "number"), ...tgt.filter((v) => typeof v === "number"));
  const top = Math.ceil((max * 1.15) / 5) * 5, step = months.length > 1 ? iw / (months.length - 1) : 0;
  const X = (i) => L + i * step, Y = (v) => T + ih - (v / top) * ih;
  const s = svg("svg", { viewBox: `0 0 ${W} ${H}`, class: "chart", id: "kpiChart", role: "img", "aria-label": "会員来店率と目標の推移(%)。数字は下の表にもあります" });
  for (let k = 0; k <= 4; k++) { const v = (top / 4) * k; s.append(svg("line", { x1: L, x2: W - R, y1: Y(v), y2: Y(v), class: "grid" }), svg("text", { x: L - 6, y: Y(v) + 4, "text-anchor": "end", class: "axis" }, `${Math.round(v)}%`)); }
  const every = Math.max(1, Math.ceil((months.length * 34) / iw));                      // 月の名前が重ならない間隔
  months.forEach((m, i) => { if ((months.length - 1 - i) % every === 0) s.append(svg("text", { x: X(i), y: H - 10, "text-anchor": "middle", class: "axis" }, `${Number(m.month.slice(5))}月`)); });
  const line = (vals, cls) => { let d = "", pen = false; vals.forEach((v, i) => { if (typeof v !== "number") { pen = false; return; } d += `${pen ? "L" : "M"}${X(i)},${Y(v)} `; pen = true; }); if (d) s.append(svg("path", { d, class: cls })); };
  line(tgt, "tgt"); line(act, "act");
  months.forEach((m, i) => {
    const v = act[i]; if (typeof v !== "number") return;
    const g = svg("g", { "data-month": m.month });
    g.append(svg("title", {}, `${m.month} 会員来店率 ${v.toFixed(1)}%(目標 ${typeof tgt[i] === "number" ? tgt[i] + "%" : "なし"})`),
      svg("circle", { cx: X(i), cy: Y(v), r: 12, class: "hit" }), svg("circle", { cx: X(i), cy: Y(v), r: 4.5, class: "dot" }));
    s.append(g);
  });
  const li = act.map((v, i) => [v, i]).filter(([v]) => typeof v === "number").at(-1);
  if (li) s.append(svg("text", { x: Math.min(X(li[1]), W - R - 30), y: Y(li[0]) - 10, "text-anchor": "middle", class: "lbl" }, `${li[0].toFixed(1)}%`));
  return s;
}

    old.replaceWith(visitRateChart(current.months || [], box.clientWidth - 38)); };

    for (let off = 0; total === null || off < total; off += 100) {
      const r = await staff.listMembers({ query: null, limit: 100, offset: off });
      if (r.kind !== "ok") { busy(false); out.style.color = "var(--bad)"; out.textContent = "会員の一覧を取得できませんでした。出力していません"; return; }
      total = r.data.total; all.push(...r.data.items); if (!r.data.items.length) break;
    }
    if (!window.confirm(`会員 ${all.length} 人分の詳細を取得して出力します。会員ごとに閲覧の記録が残ります。続けますか?`)) { busy(false); out.textContent = ""; return; }
    const startedAt = jst(new Date().toISOString());
    const head = ["会員番号", "会員の状態", "登録日", "最終の来店・利用日", "残高pt", "ランク", "累計付与pt(確認済みのみ。未確認は空欄)", "付与件数(登録)", "付与件数(来店)", "付与件数(その他)", "付与pt合計",
      "使用件数", "使用pt合計", "調整件数", "調整pt合計", "来店ポイント付与日(台帳より。来店記録そのものではない)", "台帳が100件以上(集計は直近100件のみ・不完全)", "体質タイプ", "体質チェック実施日", "詳細の取得", "取得開始時刻(会員ごとに順番に取得。厳密な同一時刻ではない)"];
    const rows = [head]; let failed = 0;
    for (let i = 0; i < all.length; i++) {
      const m = all[i]; out.textContent = `会員の詳細を取得しています… ${i + 1} / ${all.length}`;
      const r = await staff.memberDetail(m.id);
      if (r.kind !== "ok" || r.data.status !== "ok") { failed++; rows.push([m.memberNo, m.status, "", m.lastActivityOn, m.points, rankLabel(m.rank), "", "", "", "", "", "", "", "", "", "", "", "", "", "取得失敗", startedAt]); continue; }
      const d = r.data.member, L = r.data.ledger, sum = (f) => L.filter(f).reduce((a, l) => a + l.points, 0), cnt = (f) => L.filter(f).length;
      const earn = (l) => l.type === "earn", visit = (l) => earn(l) && l.rule === "visit", welcome = (l) => earn(l) && l.rule === "welcome";
      const visitDays = [...new Set(L.filter(visit).map((l) => jst(l.at, false)).filter(Boolean))].sort().join(" ");
      rows.push([d.memberNo, d.status, jst(d.createdAt, false), d.lastActivityOn, d.points, rankLabel(d.rank), d.lifetimeConfirmed ? d.lifetimePoints : "",
        cnt(welcome), cnt(visit), cnt((l) => earn(l) && !visit(l) && !welcome(l)), sum(earn), cnt((l) => l.type === "redeem"), -sum((l) => l.type === "redeem"),
        cnt((l) => l.type === "adjust"), sum((l) => l.type === "adjust"), visitDays, yn(L.length >= 100),
        // 体質(最新の結果のタイプと実施日だけ。回答は含めない)。未実施は「未実施」、応答に体質がない(104 未適用など)ときは空欄
        "constitution" in r.data ? (r.data.constitution ? ccTypeText(r.data.constitution) : "未実施") : "", r.data.constitution?.checkedOn ?? "", "取得済み", startedAt]);
    }
    busy(false); download(`10zen_members_${stamp()}.csv`, toCsv(rows));
    out.style.color = failed ? "var(--warn)" : ""; out.textContent = `出力しました(${all.length} 人・取得開始 ${startedAt}。会員ごとに順番に取得したため、厳密な同一時刻ではありません)` + (failed ? `。${failed} 人は詳細を取得できず、その行は「取得失敗」です` : "");
  };
  return put(el("section", undefined, { class: "panel", id: "exportBox" }), el("h3", "分析用の出力(CSV・店長のみ)"),
    el("p", "氏名・LINE ID は含めません。集計のスナップショットは、集計した時刻のデータです。会員別は会員ごとに順番に読み込むため、取得開始時刻を記録します(厳密な同一時刻のデータではありません)。履歴は直近100件で集計します。体質チェックは最新のタイプと実施日だけです(回答は含めません)。人数が多いと時間がかかります。", { class: "hint" }),
    put(el("div", undefined, { class: "row-flex" }), b1, b2), out);
}
start();
</script>
</body></html>
