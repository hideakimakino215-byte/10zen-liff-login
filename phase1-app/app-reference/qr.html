<!doctype html>
<!-- 店頭タブレット専用ページ(B案: 白地+ポイント使用と同じティール)。表示するのは店頭QRだけ。会員情報・ポイント・スタッフ操作へのリンクや機能は一切ない。
     店頭QR専用アカウント(role=kiosk)でログインする(試験・確認用に店長 role=manager も表示できる。staff は不可)。そのアカウントは DB 側でも他の操作がすべて拒否される。
     QR 表示中の画面には、操作できる部品(ボタン・入力・リンク)を1つも置かない。描画は textContent のみ。外部の CDN・フォントは使わない。 -->
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>10ZEN 店頭QR</title>
<style>
:root{ --bg:#f3f5f8; --card:#fff; --fg:#1c2430; --muted:#5b6675; --line:#e3e7ee; --teal:#0f9d8f; --teal-soft:#e3f5f2; --bad:#c93a3a; --bad-soft:#fde8e8; --warn:#c75f0e; --warn-soft:#fff1e3; color-scheme:light }
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
[hidden]{display:none!important}
#app{min-height:100%;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}

/* ログイン(スタッフが開始するときだけ) */
.login{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;display:grid;gap:14px}
.login .logo{height:40px;width:auto;justify-self:start}
.login h1{margin:0;font-size:22px}
.login label{display:grid;gap:6px;font-weight:700;font-size:14px}
.login input{min-height:56px;border:2px solid var(--line);border-radius:14px;padding:0 16px;font-size:18px;width:100%;min-width:0}
.login input:focus{border-color:var(--teal);outline:none}
#login{min-height:60px;border:0;border-radius:14px;background:var(--teal);color:#fff;font-size:20px;font-weight:800;cursor:pointer}
#login:disabled{opacity:.6}
#msg{margin:0;color:var(--bad);font-weight:700;min-height:1.5em}
.login .hint{margin:0;color:var(--muted);font-size:13px}

/* QR の表示(お客様が見る画面)。スタッフに聞かなくても「何か・何がもらえるか・どうするか」が分かるように */
.kiosk{width:100%;max-width:1080px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px 36px;align-items:center;background:var(--card);border:2px solid var(--teal);border-radius:24px;padding:28px 32px}
.kiosk .logo{height:44px;width:auto;display:block}
.kiosk h1{margin:14px 0 4px;font-size:34px;line-height:1.25;text-wrap:balance}
.kiosk .lead{margin:0 0 18px;font-size:17px;color:var(--muted)}
.perks{list-style:none;margin:0 0 20px;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.perk{background:var(--teal-soft);border-radius:16px;padding:14px 14px 12px;display:grid;gap:2px;align-content:start}
.perk .k{font-size:13px;font-weight:700;color:var(--teal)}
.perk .v{font-size:24px;font-weight:900;line-height:1.2;font-variant-numeric:tabular-nums}
.perk .d{font-size:13px;color:var(--muted);line-height:1.45}
.howto{display:grid;gap:8px}
.howto h2{margin:0;font-size:15px;color:var(--muted)}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px;width:fit-content}
.steps li{display:grid;grid-template-columns:36px auto;gap:12px;align-items:center;font-size:18px;font-weight:700;text-align:left}
.steps .n{width:36px;height:36px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-weight:900}
.steps small{display:block;font-size:13px;font-weight:500;color:var(--muted)}
.qrside{display:grid;justify-items:center;gap:10px}
.qrside .cap{margin:0;font-size:16px;font-weight:800;color:var(--teal)}
#qrImage{background:#fff;border:1px solid var(--line);border-radius:18px;padding:8px;min-width:240px;min-height:240px;display:grid;place-items:center}
#qrImage svg{display:block;width:min(36vw,48vh,400px);height:auto}
.refresh{width:100%;max-width:400px;display:grid;gap:6px;font-size:13px;color:var(--muted);text-align:center}
.bar{height:6px;border-radius:999px;background:var(--teal-soft);overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--teal);transform-origin:left center}
#qrMsg{margin:0;min-height:1.5em;font-size:18px;font-weight:800;text-align:center}
#qrMsg:not(:empty){color:var(--warn);background:var(--warn-soft);border:2px solid var(--warn);border-radius:14px;padding:12px 16px}
.note{grid-column:1/-1;margin:0;font-size:13px;color:var(--muted);border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-wrap:wrap;gap:4px 20px}

@media (max-width:760px),(orientation:portrait) and (max-width:900px){
  .kiosk{grid-template-columns:minmax(0,1fr);padding:20px;gap:14px;text-align:center}
  .kiosk .logo{margin:0 auto}
  .kiosk h1{font-size:27px}
  .perks{grid-template-columns:minmax(0,1fr);gap:8px;text-align:left}
  .perk{grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:12px}
  .perk .k{grid-column:1} .perk .v{grid-column:2;grid-row:1/span 2;font-size:22px} .perk .d{grid-column:1}
  .howto{justify-items:center}
  .steps li{font-size:16px}
  #qrImage svg{width:min(70vw,34vh,360px)}
  .kiosk h1{margin-top:8px}
  .note{justify-content:center;text-align:center}
}
@media (prefers-reduced-motion:reduce){ .bar i{transition:none!important} }
</style></head>
<body>
<main id="app"></main>
<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script src="vendor/qrcode.js"></script>
<script type="module">
import { createStaffClient, createQrKiosk } from "../app-core/staff-client.mjs";
const cfg = window.APP_CONFIG, app = document.getElementById("app");
const el = (tag, text, attrs = {}) => { const e = document.createElement(tag); if (text !== undefined && text !== null) e.textContent = text; for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); return e; };
const put = (parent, ...kids) => { parent.append(...kids); return parent; };
const sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey);
const staff = createStaffClient({ supabase: sb, qrEndpoint: cfg.staffQrApi });
let kiosk = null, ticker = null, wake = null;
const logo = () => el("img", undefined, { class: "logo", src: "assets/logo.png", alt: "10ZEN" });
// お客様に見せる文言。数字は DB の設定(point_rules の visit・welcome、app_settings の yen_per_100pt)と、
// 会員証(card.html)のランク特典に合わせる。変えるときは両方を直す(tools/test_kiosk_copy.mjs が食い違いを検出する)。
const KIOSK_COPY = {
  title: "10ZEN の LINE 会員証",
  lead: "LINE で読み取るだけ。アプリのダウンロードや入力はいりません。",
  perks: [
    { k: "ご来店ごとに", v: "100pt", d: "1日1回、このQRを読み取るとたまります" },
    { k: "お会計で使える", v: "100pt=10円", d: "会員証の「ポイントを使う」から" },
    { k: "ランクアップ特典", v: "薬膳茶など", d: "累計ポイントでランクが上がり、季節の薬膳茶や限定スイーツなどの特典" },
  ],
  steps: [
    ["このQRを読み取る", "LINE のQRコードリーダー、またはスマホのカメラで"],
    ["10ZEN の会員証が開く", "はじめての方は、その場で登録(100pt プレゼント)"],
    ["来店ポイントがたまる", "会員証で残高・ランク・特典をいつでも確認"],
  ],
  notes: ["会員証から「30秒体質チェック」もできます", "ポイントの使い方は会員証の画面でご確認いただけます"],
};

// URL を QR の SVG にする(ライブラリは同梱の qrcode.js。SVG は数値だけの文字列を DOMParser で読み、文字列を HTML として差し込まない)
function qrSvg(text) {
  const q = window.qrcode(0, "M"); q.addData(text); q.make();
  const doc = new DOMParser().parseFromString(q.createSvgTag({ cellSize: 8, margin: 16, scalable: true }), "image/svg+xml");
  return document.importNode(doc.documentElement, true);
}
// 店頭のタブレットが眠らないようにする(使えない端末では何もしない)
async function keepAwake() {
  try { if ("wakeLock" in navigator && !wake) { wake = await navigator.wakeLock.request("screen"); wake.addEventListener?.("release", () => { wake = null; }); } } catch (_e) { wake = null; }
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && kiosk) keepAwake(); });

async function start() {
  const w = await staff.whoami();
  if (w.kind !== "ok" || !w.data.active || (w.data.role !== "kiosk" && w.data.role !== "manager")) { if (w.kind === "ok" && w.data.active) await staff.signOut(); return loginView(w.kind === "ok" && w.data.active ? "このアカウントでは表示できません。店頭QR専用のアカウントでログインしてください" : null); }
  const url = el("pre", "", { id: "qrUrl", hidden: "" }), msg = el("p", "", { id: "qrMsg", role: "status" });
  const box = el("div", undefined, { id: "qrImage", role: "img", "aria-label": "来店用のQRコード" });
  const fill = el("i"), left = el("span", "QRコードは30秒ごとに変わります");
  const refresh = put(el("div", undefined, { class: "refresh", "aria-hidden": "true" }), put(el("div", undefined, { class: "bar" }), fill), left);
  const C = KIOSK_COPY;
  const perks = put(el("ul", undefined, { class: "perks", "aria-label": "会員の特典" }), ...C.perks.map((x) => put(el("li", undefined, { class: "perk" }), el("span", x.k, { class: "k" }), el("span", x.v, { class: "v" }), el("span", x.d, { class: "d" }))));
  const steps = put(el("ol", undefined, { class: "steps" }), ...C.steps.map(([t, sub], i) => put(el("li"), el("span", String(i + 1), { class: "n", "aria-hidden": "true" }), put(el("span", t), el("small", sub)))));
  const info = put(el("section"), logo(), el("h1", C.title), el("p", C.lead, { class: "lead" }), perks, put(el("div", undefined, { class: "howto" }), el("h2", "使い方"), steps));
  const qr = put(el("section", undefined, { class: "qrside" }), el("p", "こちらを LINE で読み取り", { class: "cap" }), box, refresh, msg);
  app.replaceChildren(put(el("div", undefined, { class: "kiosk" }), info, qr, put(el("p", undefined, { class: "note" }), ...C.notes.map((t) => el("span", "・" + t)))), url);   // URL は画面に出さない(テスト用に非表示で保持)
  let nextAt = 0;
  const tick = () => { const ms = nextAt - Date.now(); const ratio = nextAt ? Math.max(0, Math.min(1, ms / 30000)) : 0; fill.style.transform = `scaleX(${ratio})`; };
  ticker = setInterval(tick, 250);
  kiosk = createQrKiosk({
    getToken: () => staff.qrToken(),
    onUpdate: (d) => { url.textContent = d.url; msg.textContent = ""; refresh.hidden = false; box.replaceChildren(qrSvg(d.url)); nextAt = Number(d.nextChangeAt) || 0; tick(); },
    onHidden: () => { url.textContent = ""; box.replaceChildren(); refresh.hidden = true; nextAt = 0; msg.textContent = "ただいま表示できません。スタッフにお声がけください"; },
  });
  kiosk.start();
  keepAwake();
}
function loginView(msg) {
  if (kiosk) { kiosk.stop(); kiosk = null; }
  if (ticker) { clearInterval(ticker); ticker = null; }
  const e = el("input", undefined, { id: "email", type: "email", autocomplete: "username" }), p = el("input", undefined, { id: "password", type: "password", autocomplete: "current-password" });
  const b = el("button", "表示を開始", { id: "login" });
  const m = el("p", msg || "", { id: "msg", role: "alert" });
  const go = async () => { b.disabled = true; m.textContent = ""; const r = await staff.signIn(e.value, p.value); b.disabled = false; if (r.kind !== "ok") { m.textContent = "ログインできませんでした"; return; } start(); };
  b.onclick = go; p.onkeydown = (ev) => { if (ev.key === "Enter") go(); };
  app.replaceChildren(put(el("div", undefined, { class: "login" }), logo(), el("h1", "店頭QRの表示"),
    el("p", "店頭QR専用のアカウントでログインすると、お客様向けの来店QRを表示します。", { class: "hint" }),
    put(el("label", "メールアドレス"), e), put(el("label", "パスワード"), p), b, m));
}
start();
</script>
</body></html>
