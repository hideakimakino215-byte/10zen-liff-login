<!doctype html>
<!-- 1分体質チェック(LIFF)。会員証(card.html)と同じ世界観(和紙色の地・明朝の見出し・茶の差し色)。設計: CONSTITUTION_CHECK_DESIGN_20261015.md
     流れ: (初回だけ)同意 → 15問(1問1画面・タップで次へ)→ 食事の気分 → 結果。点数とタイプは DB が計算する(画面は回答だけを送る)。
     UI が守ること: 表示は screens.mjs の constitutionCardView / constitutionResultView の項目をそのまま使う。値は textContent で入れる(innerHTML 不可)。
     グラフは inline SVG(app-core/radar.mjs が createElementNS で組み立てる)。外部のライブラリ・CDN・フォントは使わない。
     お客様に見せる説明文は app-core/constitution-content.mjs に集約(言葉づかいのきまり: 「治る・効く・改善」を使わない)。 -->
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>10ZEN 1分体質チェック</title>
<style>
:root { --ink:#2b2926; --sub:#7a746b; --line:#e7e1d8; --bg:#f7f4ee; --paper:#fffefb; --accent:#8a6a3b; --accent-soft:#f3ebdd; --ok:#2f6b4f; --warn:#a4452c; }
* { box-sizing:border-box; }
[hidden] { display:none !important; }
html, body { margin:0; background:var(--bg); color:var(--ink); font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Noto Sans JP",system-ui,sans-serif; -webkit-text-size-adjust:100%; }
main { max-width:440px; margin:0 auto; padding:16px 16px 40px; }
h1, h2, h3, p { margin:0; }
a { color:inherit; }
button { font-family:inherit; color:inherit; }
.serif { font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif; }
.top { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
.top img { width:96px; height:auto; display:block; }
.top h1 { font-size:18px; font-weight:600; letter-spacing:.08em; margin-left:auto; }
.panel { background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:18px; margin-top:14px; }
.label { font-size:11px; letter-spacing:.14em; color:var(--sub); }
.lead { font-size:15px; line-height:1.8; margin-top:8px; }
.meta { font-size:12px; color:var(--sub); line-height:1.7; margin-top:6px; }
.msg { text-align:center; font-size:15px; line-height:1.7; margin:24px 0 8px; }
.notice { background:#fff; border:1px solid var(--line); border-left:4px solid var(--warn); border-radius:8px; padding:12px 14px; margin:0 0 14px; font-size:14px; line-height:1.6; }
.primary, .ghost { display:flex; align-items:center; justify-content:center; width:100%; min-height:52px; border-radius:12px; font-size:16px; font-weight:600; cursor:pointer; text-decoration:none; margin-top:14px; }
.primary { border:0; background:var(--ink); color:#fff; } .ghost { border:1px solid var(--ink); background:#fff; color:var(--ink); }
/* ---- 1問1画面 ---- */
.progress { display:flex; align-items:center; gap:10px; font-size:13px; color:var(--sub); font-variant-numeric:tabular-nums; }
.bar { flex:1; height:6px; background:#ece6dc; border-radius:999px; overflow:hidden; }
.bar > i { display:block; height:100%; background:linear-gradient(90deg,#b99256,#8a6a3b); border-radius:999px; transition:width .25s ease; }
.q { min-height:7.2em; display:flex; align-items:center; font-size:22px; line-height:1.6; font-weight:600; margin:22px 2px 6px; overflow-wrap:anywhere; }
.opts { display:grid; gap:10px; margin-top:8px; }
.opt { min-height:64px; width:100%; border:1px solid var(--line); border-radius:14px; background:var(--paper); font-size:18px; font-weight:600; letter-spacing:.06em; cursor:pointer; box-shadow:0 1px 2px rgba(60,45,20,.06); }
.opt[aria-pressed=true], .opt:active { background:var(--accent-soft); border-color:var(--accent); }
.back { margin-top:18px; min-height:44px; padding:0 14px; border:0; background:none; color:var(--sub); font-size:14px; cursor:pointer; }
/* ---- 結果 ---- */
.type { text-align:center; padding-top:22px; }
.type h2 { font-size:26px; font-weight:600; letter-spacing:.06em; margin-top:6px; }
.type p.line { font-size:14.5px; line-height:1.8; margin-top:10px; text-align:left; }
.radar-wrap { margin-top:10px; }
.radar { display:block; width:100%; max-width:320px; height:auto; margin:0 auto; cursor:pointer; }
.radar-ring { fill:none; stroke:#e4dccf; stroke-width:1; }
.radar-axis { stroke:#e4dccf; stroke-width:1; }
.radar-area { fill:rgba(138,106,59,.22); stroke:var(--accent); stroke-width:2; stroke-linejoin:round; }
.radar-dot { fill:var(--accent); }
.radar-label { font-size:15px; fill:var(--ink); font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif; }
.radar-value { font-size:12px; fill:var(--sub); font-family:system-ui,sans-serif; }
.toggle { display:block; margin:6px auto 0; min-height:44px; padding:0 16px; border:1px solid var(--line); border-radius:999px; background:#fff; font-size:13px; cursor:pointer; }
.detail { list-style:none; margin:12px 0 0; padding:0; display:grid; gap:6px; }
.detail li { display:grid; grid-template-columns:2.4em 1fr auto; gap:8px; align-items:baseline; padding:8px 10px; border:1px solid var(--line); border-radius:10px; font-size:13px; line-height:1.5; background:#fff; }
.detail li.on { border-color:var(--accent); background:var(--accent-soft); }
.detail .k { font-size:18px; text-align:center; }
.detail .s { color:var(--sub); font-variant-numeric:tabular-nums; }
.item h3 { font-size:17px; font-weight:600; margin-top:6px; line-height:1.5; }
.item p.body { font-size:14px; line-height:1.75; margin-top:4px; }
.tea-day { display:inline-block; margin-top:8px; font-size:13px; font-weight:600; color:var(--accent); border:1px solid var(--accent); border-radius:999px; padding:4px 12px; }
.nihondo { text-align:center; }
.nihondo a { display:flex; align-items:center; justify-content:center; min-height:52px; margin-top:12px; border-radius:12px; border:1px solid var(--accent); color:var(--accent); background:#fff; font-weight:600; text-decoration:none; }
.disclaimer { font-size:12px; color:var(--sub); text-align:center; line-height:1.7; margin-top:16px; }
@media (prefers-reduced-motion: reduce) { .bar > i { transition:none; } }
</style></head>
<body>
<main id="app" aria-live="polite"><p id="loading" class="msg">読み込み中…</p></main>
<script src="config.js"></script>
<script src="vendor/liff.js"></script>
<script type="module">
import { createMemberClient } from "../app-core/member-client.mjs";
import { cardScreen, checkSubmitScreen } from "../app-core/screens.mjs";
import { QUESTIONS, ANSWER_OPTIONS, ELEMENTS, ELEMENT_INFO } from "../app-core/constitution.mjs";
import { MOODS, MOOD_QUESTION, CONSENT_TEXT, INTRO_TEXT, CHECK_NAME, DISCLAIMER, NIHONDO_LEAD, NIHONDO_BUTTON } from "../app-core/constitution-content.mjs";
import { NIHONDO_CONSULT_URL } from "../app-core/store-info.mjs";
import { radarSvg } from "../app-core/radar.mjs";
const cfg = window.APP_CONFIG, app = document.getElementById("app");
const el = (tag, text, attrs = {}) => { const e = document.createElement(tag); if (text !== undefined && text !== null) e.textContent = text; for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); return e; };
const kids = (parent, ...nodes) => { for (const n of nodes) if (n) parent.append(n); return parent; };
const header = () => kids(el("header", undefined, { class: "top" }), el("img", undefined, { src: "assets/logo.png", alt: "10ZEN YAKUZEN RESTAURANT", width: "1400", height: "518" }), el("h1", CHECK_NAME, { class: "serif" }));
const show = (...nodes) => { app.replaceChildren(header(), ...nodes); window.scrollTo(0, 0); };
const toCard = (text = "会員証へ戻る", cls = "ghost") => el("a", text, { id: "ccToCard", href: "card.html", class: cls });
const TOTAL = QUESTIONS.length + 1;                            // 15問+食事の気分
let client, check = null, answers = [], idx = 0, consentGiven = false, busy = false;

function errorView(message, retry) {
  const nodes = [el("p", message, { id: "msg", class: "msg" })];
  if (retry) { const b = el("button", "もう一度試す", { id: "retry", class: "primary" }); b.onclick = start; nodes.push(b); }
  show(...nodes, toCard());
}

// はじめの画面(初回は同意を兼ねる)
function introView(error) {
  const box = el("section", undefined, { class: "panel", id: check?.consented ? "ccIntro" : "ccConsent" });
  kids(box, el("p", "はじめに", { class: "label" }), el("p", INTRO_TEXT, { class: "lead" }));
  if (!check?.consented) box.append(el("p", CONSENT_TEXT, { id: "ccConsentText", class: "lead" }));
  box.append(el("p", DISCLAIMER, { class: "meta" }));
  const b = el("button", check?.consented ? "はじめる" : "同意してはじめる", { id: check?.consented ? "ccStart" : "ccAgree", class: "primary" });
  b.onclick = () => { consentGiven = !check?.consented; answers = []; idx = 0; questionView(); };
  box.append(b);
  show(...(error ? [el("p", error, { id: "notice", class: "notice", role: "status" })] : []), box, toCard("会員証へ戻る"));
}

// 1問1画面。タップで次へ(戻るで1つ前へ)
function questionView() {
  const isMood = idx >= QUESTIONS.length, q = QUESTIONS[idx];
  const fill = el("i"); fill.style.width = `${Math.round((100 * idx) / TOTAL)}%`;
  const progress = kids(el("div", undefined, { class: "progress", id: "ccProgress" }), el("span", `${idx + 1} / ${TOTAL}`, { id: "ccStep" }),
    kids(el("div", undefined, { class: "bar", role: "progressbar", "aria-valuemin": "0", "aria-valuemax": String(TOTAL), "aria-valuenow": String(idx) }), fill));
  const text = el("h2", isMood ? MOOD_QUESTION : q.text, { id: "ccQuestion", class: "q serif" });
  const opts = el("div", undefined, { class: "opts", id: "ccOptions", role: "group", "aria-labelledby": "ccQuestion" });
  const choices = isMood ? MOODS.map((m) => ({ value: m.code, label: m.label })) : ANSWER_OPTIONS;
  const current = isMood ? null : answers[idx];
  for (const c of choices) {
    const b = el("button", c.label, { class: "opt", "data-value": String(c.value), "aria-pressed": String(current === c.value) });
    b.onclick = () => {
      if (busy) return;
      b.setAttribute("aria-pressed", "true");
      if (isMood) return submit(c.value);
      answers[idx] = c.value; idx += 1; busy = true;
      setTimeout(() => { busy = false; questionView(); }, 160);     // 選んだことが見えてから次へ
    };
    opts.append(b);
  }
  const back = el("button", "‹ 戻る", { id: "ccBack", class: "back" });
  back.onclick = () => { if (busy) return; if (idx === 0) introView(); else { idx -= 1; questionView(); } };
  show(progress, text, opts, back);
}

async function submit(mood) {
  busy = true;
  show(el("p", "結果を作っています…", { id: "ccBusy", class: "msg" }));
  const s = checkSubmitScreen(await client.constitutionSubmit({ answers: answers.slice(0, QUESTIONS.length), mood, consent: consentGiven }), Date.now());
  busy = false;
  if (s.screen === "result" && s.view?.result) { check = s.view; return resultView(s.view); }
  if (s.screen === "consent") { check = { ...(check || {}), consented: false }; return introView(s.error); }
  if (s.screen === "needs_login") { window.liff.login?.(); return errorView(s.message, false); }
  errorView(s.message, s.retry);
}

// 結果: タイプ・五角形(タップで正式名称)・今日のおすすめの一品・五巡茶・季節・薬日本堂・診断ではない旨
function resultView(v) {
  const r = v.result;
  const type = kids(el("section", undefined, { class: "panel type", id: "ccResult" }), el("p", "あなたの体質の傾向", { class: "label" }),
    el("h2", r.typeName, { id: "ccTypeName", class: "serif" }), el("p", r.typeLine, { id: "ccTypeLine", class: "line" }));
  const labels = Object.fromEntries(ELEMENTS.map((e) => [e, ELEMENT_INFO[e].kanji]));
  const svg = radarSvg(document, r.scores, { labels, max: 6, id: "ccRadar", title: "五行ごとの点数(0〜6)", valueText: (x) => String(x ?? "—") });
  const detail = el("ul", undefined, { class: "detail", id: "ccDetail", hidden: "" });
  for (const d of r.details) detail.append(kids(el("li", undefined, d.isPrimary ? { class: "on" } : {}), el("span", d.kanji, { class: "k serif" }),
    el("span", `五臓: ${d.organ} / ${d.state}`), el("span", `${d.score ?? "—"}点`, { class: "s" })));
  const toggle = el("button", "五行・五臓・正式名称を見る", { id: "ccDetailToggle", class: "toggle", "aria-expanded": "false", "aria-controls": "ccDetail" });
  const flip = () => { const open = detail.hidden; detail.hidden = !open; toggle.setAttribute("aria-expanded", String(open)); toggle.textContent = open ? "閉じる" : "五行・五臓・正式名称を見る"; };
  toggle.onclick = flip; svg.addEventListener("click", flip);
  kids(type, kids(el("div", undefined, { class: "radar-wrap" }), svg), toggle, detail);
  if (r.formalText) detail.prepend(el("p", r.formalText, { id: "ccFormal", class: "meta" }));
  const nodes = [type];
  if (r.dish) nodes.push(kids(el("section", undefined, { class: "panel item", id: "ccDish" }), el("p", r.dish.basis === "today" ? "今日のおすすめの一品(今日の体調から)" : "今日のおすすめの一品", { class: "label" }),
    el("h3", r.dish.name, { class: "serif" }), el("p", r.dish.reason, { class: "body" })));
  nodes.push(kids(el("section", undefined, { class: "panel item", id: "ccYourTea" }), el("p", "あなたの五巡茶", { class: "label" }), el("h3", r.yourTea.name, { class: "serif" }),
    el("p", r.yourTea.line, { class: "body" }), el("span", r.yourTea.dayText, { id: "ccYourTeaDay", class: "tea-day" })));
  if (r.todayTea) nodes.push(kids(el("section", undefined, { class: "panel item", id: "ccTodayTea" }), el("p", `今日の五巡茶(${r.todayTea.weekday})`, { class: "label" }),
    el("h3", r.todayTea.name, { class: "serif" }), el("p", r.todayTea.line, { class: "body" })));
  if (r.season) nodes.push(kids(el("section", undefined, { class: "panel item", id: "ccSeason" }), el("p", `季節のひとこと(${r.season.name})`, { class: "label" }), el("p", r.season.line, { class: "body" })));
  const link = el("a", NIHONDO_BUTTON, { id: "ccNihondo", href: NIHONDO_CONSULT_URL, target: "_blank", rel: "noopener noreferrer" });
  link.addEventListener("click", () => { client.referralClick().catch(() => {}); });         // 押された数だけを記録(結果は待たずに開く)
  nodes.push(kids(el("section", undefined, { class: "panel nihondo" }), el("p", NIHONDO_LEAD, { class: "lead" }), link));
  nodes.push(el("p", DISCLAIMER, { id: "ccDisclaimer", class: "disclaimer" }));
  const again = el("button", "もう一度チェックする", { id: "ccRetake", class: "ghost" }); again.onclick = () => { answers = []; idx = 0; consentGiven = false; introView(); };
  nodes.push(toCard("会員証へ戻る", "primary"), again);
  show(...nodes);
}

async function start() {
  const s = cardScreen(await client.me(), Date.now());
  if (s.screen === "register") return show(el("p", "会員証で会員登録をしてから、体質チェックをお試しください", { id: "msg", class: "msg" }), toCard("会員証へ", "primary"));
  if (s.screen === "needs_login") { window.liff.login?.(); return errorView(s.message, false); }
  if (s.screen !== "card") return errorView(s.message, s.retry);
  check = s.view.check;
  if (!check) return errorView("ただいま体質チェックは準備中です", false);           // DB が未対応(103 未適用)
  const wantResult = new URLSearchParams(location.search).get("view") === "result";
  if (wantResult && check.result) return resultView(check);
  introView();
}
(async () => {
  try { await window.liff.init({ liffId: cfg.liffId }); } catch (_e) { return show(el("p", "LINE アプリで開いてください", { id: "msg", class: "msg" })); }
  if (!window.liff.isLoggedIn()) { window.liff.login(); return; }
  client = createMemberClient({ endpoint: cfg.memberApi, getIdToken: async () => window.liff.getIDToken() });
  start();
})();
</script>
</body></html>
