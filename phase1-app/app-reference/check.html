<!doctype html>
<!-- 1分体質チェック(LIFF)。会員証(card.html)と同じ世界観(和紙色の地・明朝の見出し・茶の差し色)。設計: CONSTITUTION_CHECK_DESIGN_20261015.md
     流れ: (初回だけ)同意 → 15問(1問1画面・タップで次へ)→ 食事の気分 → 結果。点数とタイプは DB が計算する(画面は回答だけを送る)。
     来店のたびに何度でもできる(任意。db/107)。結果は「今日の傾向」(今回の結果)と「あなたの体質」(最新3回の平均。DB が計算)の2つと、これまでのチェック(最新6回)。
     会員証の「今日のチェックをはじめる」(?start=1)からは、同意済みならはじめの画面を飛ばして1問目から。
     お席の QR(?table=<テーブル>。2026-10-16 牧野さん承認)から入ったら、結果の「このまま注文する」でそのテーブルのダイニーの注文画面へ(読み直し不要)。
     お席の QR から入っていなくても、来店した日(visitedToday)はお席の QR を読み取るボタン。どちらでもなければ(家など)注文のボタンは出さない。
     UI が守ること: 表示は screens.mjs の constitutionCardView / constitutionResultView の項目をそのまま使う。値は textContent で入れる(innerHTML 不可)。
     グラフは inline SVG(app-core/radar.mjs が createElementNS で組み立てる)。外部のライブラリ・CDN・フォントは使わない。
     お客様に見せる説明文は app-core/constitution-content.mjs に集約(言葉づかいのきまり: 「治る・効く・改善」を使わない)。 -->
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>10ZEN 1分体質チェック</title>
<style>
:root { --ink:#2b2926; --sub:#6f685e; --line:#e7e1d8; --bg:#f7f4ee; --paper:#fffefb; --accent:#8a6a3b; --accent-soft:#f3ebdd; --ok:#2f6b4f; --warn:#a4452c; }
* { box-sizing:border-box; }
[hidden] { display:none !important; }
html, body { margin:0; background:var(--bg); color:var(--ink); font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Noto Sans JP",system-ui,sans-serif; -webkit-text-size-adjust:100%; }
main { max-width:440px; margin:0 auto; padding:16px 16px 40px; }
h1, h2, h3, p { margin:0; }
a { color:inherit; }
button { font-family:inherit; color:inherit; }
.serif { font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif; }
.top { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
.top img { width:96px; height:auto; display:block; }
.top h1 { font-size:18px; font-weight:600; letter-spacing:.08em; margin-left:auto; }
html:lang(en) .top h1 { font-size:16px; letter-spacing:.01em; text-align:right; }
.panel { background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:18px; margin-top:14px; }
.label { font-size:13px; letter-spacing:.1em; color:var(--sub); }
.lead { font-size:15px; line-height:1.8; margin-top:8px; }
.meta { font-size:13px; color:var(--sub); line-height:1.7; margin-top:6px; }
.msg { text-align:center; font-size:15px; line-height:1.7; margin:24px 0 8px; }
.notice { background:#fff; border:1px solid var(--line); border-left:4px solid var(--warn); border-radius:8px; padding:12px 14px; margin:0 0 14px; font-size:14px; line-height:1.6; }
.primary, .ghost { display:flex; align-items:center; justify-content:center; width:100%; min-height:52px; border-radius:12px; font-size:16px; font-weight:600; cursor:pointer; text-decoration:none; margin-top:14px; }
.primary { border:0; background:var(--ink); color:#fff; } .ghost { border:1px solid var(--ink); background:#fff; color:var(--ink); }
/* ---- 1問1画面 ---- */
.progress { display:flex; align-items:center; gap:10px; font-size:13px; color:var(--sub); font-variant-numeric:tabular-nums; }
.bar { flex:1; height:6px; background:#ece6dc; border-radius:999px; overflow:hidden; }
.bar > i { display:block; height:100%; background:linear-gradient(90deg,#b99256,#8a6a3b); border-radius:999px; transition:width .25s ease; }
.q { min-height:7.2em; display:flex; align-items:center; font-size:22px; line-height:1.6; font-weight:600; margin:22px 2px 6px; overflow-wrap:anywhere; }
.opts { display:grid; gap:10px; margin-top:8px; }
.opt { min-height:64px; width:100%; border:1px solid var(--line); border-radius:14px; background:var(--paper); font-size:18px; font-weight:600; letter-spacing:.06em; cursor:pointer; box-shadow:0 1px 2px rgba(60,45,20,.06); }
.opt[aria-pressed=true], .opt:active { background:var(--accent-soft); border-color:var(--accent); }
.back { margin-top:18px; min-height:44px; padding:0 14px; border:0; background:none; color:var(--sub); font-size:14px; cursor:pointer; }
/* ---- 結果 ---- */
.type { text-align:center; padding-top:22px; }
.type h2 { font-size:26px; font-weight:600; letter-spacing:.06em; margin-top:6px; }
.type p.line { font-size:14.5px; line-height:1.8; margin-top:10px; text-align:left; }
.radar-wrap { margin-top:10px; }
.radar { display:block; width:100%; max-width:320px; height:auto; margin:0 auto; cursor:pointer; }
.radar-ring { fill:none; stroke:#e4dccf; stroke-width:1; }
.radar-axis { stroke:#e4dccf; stroke-width:1; }
.radar-area { fill:rgba(122,116,107,.16); stroke:#8f887d; stroke-width:2; stroke-linejoin:round; }   /* 面は無彩色。点と軸の名前を五行の色にする(app-core/constitution.mjs の ELEMENT_COLORS) */
.radar-dot { fill:var(--accent); }
.radar-label { font-size:16px; fill:var(--ink); font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif; }
.radar-value { font-size:12px; font-weight:400; fill:var(--sub); font-family:system-ui,sans-serif; }
.toggle { display:block; margin:6px auto 0; min-height:44px; padding:0 16px; border:1px solid var(--line); border-radius:999px; background:#fff; font-size:13px; cursor:pointer; }
.detail { list-style:none; margin:12px 0 0; padding:0; display:grid; gap:6px; }
.detail li { text-align:left; display:grid; grid-template-columns:2.4em 1fr auto; gap:8px; align-items:baseline; padding:8px 10px; border:1px solid var(--line); border-radius:10px; font-size:13px; line-height:1.5; background:#fff; }
.detail li.on { border-color:var(--accent); background:var(--accent-soft); }
.detail .k { font-size:18px; text-align:center; }
.detail .s { color:var(--sub); font-variant-numeric:tabular-nums; }
.item h3 { font-size:17px; font-weight:600; margin-top:6px; line-height:1.5; }
.item p.body { font-size:14px; line-height:1.75; margin-top:4px; }
.tea-day { display:inline-block; margin-top:8px; font-size:13px; font-weight:600; color:var(--accent); border:1px solid var(--accent); border-radius:999px; padding:4px 12px; }
.nihondo { text-align:center; }
.nihondo a { display:flex; align-items:center; justify-content:center; min-height:52px; margin-top:12px; border-radius:12px; border:1px solid var(--accent); color:var(--accent); background:#fff; font-weight:600; text-decoration:none; }
.profile h2 { font-size:22px; font-weight:600; letter-spacing:.06em; margin-top:6px; text-align:center; }
.profile .basis { text-align:center; }
.profile .radar { max-width:240px; cursor:default; }
.history { list-style:none; margin:10px 0 0; padding:0; display:grid; gap:6px; }
.history li { display:grid; grid-template-columns:3.6em auto 1fr; gap:10px; align-items:center; padding:8px 10px; border:1px solid var(--line); border-radius:10px; background:#fff; font-size:13px; }
.history li.latest { border-color:var(--accent); }
.history .d { color:var(--sub); font-variant-numeric:tabular-nums; }
.history .chip { display:inline-block; min-width:2.2em; text-align:center; padding:2px 8px; border-radius:999px; border:1.5px solid #b8bfc8; background:#f1f3f6; font-weight:700; font-size:13px; white-space:nowrap; }
.history .t { overflow-wrap:anywhere; }
.disclaimer { font-size:13px; color:var(--sub); text-align:center; line-height:1.7; margin-top:16px; }
/* ---- 生薬の絵(会員証と同じ水彩の6種。飾りなので読み上げない) ---- */
.hero { position:relative; height:118px; margin:2px 0 4px; }
.hero img, .corner { position:absolute; height:auto; pointer-events:none; }
.qherb { display:block; width:76px; height:auto; margin:16px auto 0; animation:herbIn .35s ease; }
.type { position:relative; overflow:hidden; }
.type > *:not(.corner) { position:relative; }
.corner { opacity:.92; }
@keyframes herbIn { from { opacity:0; transform:translateY(6px) rotate(-6deg); } to { opacity:1; transform:none; } }
@media (prefers-reduced-motion: reduce) { .bar > i { transition:none; } .qherb { animation:none; } }
/* 言語の切り替え(会員証と同じ) */
.lang { display:flex; justify-content:flex-end; gap:6px; margin:0 0 10px; }
.lang button { min-height:44px; padding:0 14px; border-radius:22px; border:1px solid var(--line); background:#fff; color:var(--sub); font:inherit; font-size:14px; cursor:pointer; }
.lang button[aria-current="true"] { border-color:var(--ink); color:var(--ink); font-weight:600; }
</style></head>
<body>
<main id="app" aria-live="polite"><p id="loading" class="msg">読み込み中…</p></main>
<script src="config.js"></script>
<script src="vendor/liff.js"></script>
<script type="module">
import { createMemberClient } from "../app-core/member-client.mjs";
import { cardScreen, checkSubmitScreen } from "../app-core/screens.mjs";
import { QUESTIONS, ANSWER_OPTIONS, ELEMENT_COLORS, ELEMENT_TEXT_COLORS, ELEMENT_SOFT_COLORS } from "../app-core/constitution.mjs";
import { MOODS } from "../app-core/constitution-content.mjs";
import { ccText, orderText, detectLang, storedLang, saveLang, langSwitcher, HTML_LANG } from "../app-core/i18n.mjs";
import { NIHONDO_CONSULT_URL } from "../app-core/store-info.mjs";
import { radarSvg } from "../app-core/radar.mjs";
import { diniiEnabled, diniiOrderUrl, diniiTableUrl, rememberTable, recallTable } from "../app-core/dinii.mjs";
const cfg = window.APP_CONFIG, app = document.getElementById("app");
const el = (tag, text, attrs = {}) => { const e = document.createElement(tag); if (text !== undefined && text !== null) e.textContent = text; for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); return e; };
const kids = (parent, ...nodes) => { for (const n of nodes) if (n) parent.append(n); return parent; };
// タイプ名・五巡茶の名前は五行の文字色(会員証と同じ。白地・和紙色の地で 4.5:1 以上)。バランス良好は墨色のまま
// 言語(2026-10-17): 選んだ言語 → LINE の言語 → 端末の言語。画面の上の「日本語 / English / 中文」で切り替え(この端末に覚える)。文は app-core/i18n.mjs
const langStore = (() => { try { return window.localStorage; } catch (_e) { return null; } })();
let lang = detectLang({ stored: storedLang(langStore), nav: navigator.languages }), CT = ccText(lang), OT = orderText(lang), rerender = null;
const setLang = (l) => { lang = l; CT = ccText(l); OT = orderText(l); document.documentElement.lang = HTML_LANG[l]; };
const switcher = () => langSwitcher(document, lang, (l) => { saveLang(langStore, l); setLang(l); if (rerender) rerender(); });
const inElementColor = (node, element) => { if (ELEMENT_TEXT_COLORS[element]) { node.style.color = ELEMENT_TEXT_COLORS[element]; node.dataset.element = element; } return node; };
const header = () => kids(el("header", undefined, { class: "top" }), el("img", undefined, { src: "assets/logo.png", alt: "10ZEN YAKUZEN RESTAURANT", width: "1400", height: "518" }), el("h1", CT.checkName, { class: "serif" }));
const show = (...nodes) => { app.replaceChildren(switcher(), header(), ...nodes); window.scrollTo(0, 0); };
const toCard = (text = CT.toCard, cls = "ghost") => el("a", text, { id: "ccToCard", href: "card.html", class: cls });
// 生薬の絵(assets/herb-名前.webp。会員証と同じ6種)。飾りなので alt は空・aria-hidden
const HERB_NAMES = ["goji", "chenpi", "jujube", "anise", "lotus", "chili"];
const herb = (name, attrs = {}) => el("img", undefined, { src: `assets/herb-${name}.webp`, alt: "", "aria-hidden": "true", decoding: "async", ...attrs });
const HERO = [["chili", "left:2%;top:6%;width:17%"], ["goji", "left:22%;top:38%;width:15%"], ["chenpi", "left:41%;top:2%;width:16%"],
  ["jujube", "left:58%;top:44%;width:13%"], ["anise", "left:72%;top:4%;width:15%"], ["lotus", "right:1%;top:40%;width:17%"]];
const TOTAL = QUESTIONS.length + 1;                            // 15問+食事の気分
let client, check = null, answers = [], idx = 0, consentGiven = false, busy = false, visitedToday = false;
const store = (() => { try { return window.sessionStorage; } catch (_e) { return null; } })();
rememberTable(store, new URLSearchParams(location.search).get("table"));
// 途中でやめた回答(この端末の中だけ・1時間)。送信できたら消す(ペルソナ実験 2026-10-17: 途中でやめると最初からだった)
const PROGRESS_KEY = "10zen_cc_progress", PROGRESS_TTL_MS = 3600e3;
const saveProgress = () => { try { store?.setItem(PROGRESS_KEY, JSON.stringify({ answers: answers.slice(0, QUESTIONS.length), idx, consentGiven, at: Date.now() })); } catch (_e) { /* 使えない端末 */ } };
const clearProgress = () => { try { store?.removeItem(PROGRESS_KEY); } catch (_e) { /* 使えない端末 */ } };
const loadProgress = () => { try { const v = JSON.parse(store?.getItem(PROGRESS_KEY) ?? "null");
  return v && Number.isInteger(v.idx) && v.idx > 0 && v.idx <= QUESTIONS.length && Array.isArray(v.answers) && v.answers.slice(0, v.idx).every((a) => [0, 1, 2].includes(a)) && Date.now() - v.at < PROGRESS_TTL_MS ? v : null; } catch (_e) { return null; } };   // お席の QR から(会員登録で会員証へ移っても4時間覚える)

function errorView(message, retry) {
  rerender = client ? start : null;
  const nodes = [el("p", message, { id: "msg", class: "msg" })];
  if (retry) { const b = el("button", CT.retry, { id: "retry", class: "primary" }); b.onclick = start; nodes.push(b); }
  show(...nodes, toCard());
}

// はじめの画面(初回は同意を兼ねる)
function introView(error) {
  rerender = () => introView(error);
  const box = el("section", undefined, { class: "panel", id: check?.consented ? "ccIntro" : "ccConsent" });
  const hero = el("div", undefined, { class: "hero", "aria-hidden": "true" });
  for (const [name, pos] of HERO) hero.append(herb(name, { style: pos }));
  kids(box, hero, el("p", CT.introLabel, { class: "label" }), el("p", CT.intro, { class: "lead" }));
  if (!check?.consented) box.append(el("p", CT.consent, { id: "ccConsentText", class: "lead" }));
  box.append(el("p", CT.disclaimer, { class: "meta" }));
  const b = el("button", check?.consented ? CT.start : CT.agreeStart, { id: check?.consented ? "ccStart" : "ccAgree", class: "primary" });
  b.onclick = () => { consentGiven = !check?.consented; answers = []; idx = 0; questionView(); };
  box.append(b);
  const saved = loadProgress();
  if (saved) { const r = el("button", CT.resume(saved.idx + 1), { id: "ccResume", class: "ghost" }); r.onclick = () => { answers = saved.answers.slice(0, saved.idx); idx = saved.idx; consentGiven = saved.consentGiven || !!check?.consented; questionView(); }; box.append(r); }
  show(...(error ? [el("p", error, { id: "notice", class: "notice", role: "status" })] : []), box, toCard(CT.toCard));
}

// 1問1画面。タップで次へ(戻るで1つ前へ)
function questionView() {
  rerender = questionView;
  const isMood = idx >= QUESTIONS.length, q = QUESTIONS[idx];
  const fill = el("i"); fill.style.width = `${Math.round((100 * idx) / TOTAL)}%`;
  const progress = kids(el("div", undefined, { class: "progress", id: "ccProgress" }), el("span", `${idx + 1} / ${TOTAL}`, { id: "ccStep" }),
    kids(el("div", undefined, { class: "bar", role: "progressbar", "aria-valuemin": "0", "aria-valuemax": String(TOTAL), "aria-valuenow": String(idx) }), fill));
  const text = el("h2", isMood ? CT.moodQuestion : CT.questions[idx] ?? q.text, { id: "ccQuestion", class: "q serif" });
  const opts = el("div", undefined, { class: "opts", id: "ccOptions", role: "group", "aria-labelledby": "ccQuestion" });
  const choices = isMood ? MOODS.map((m) => ({ value: m.code, label: CT.moods[m.code] ?? m.label })) : ANSWER_OPTIONS.map((a) => ({ value: a.value, label: CT.answers[a.value] ?? a.label }));
  const current = isMood ? null : answers[idx];
  for (const c of choices) {
    const b = el("button", c.label, { class: "opt", "data-value": String(c.value), "aria-pressed": String(current === c.value) });
    b.onclick = () => {
      if (busy) return;
      b.setAttribute("aria-pressed", "true");
      if (isMood) return submit(c.value);
      answers[idx] = c.value; idx += 1; busy = true;
      setTimeout(() => { busy = false; questionView(); }, 160);     // 選んだことが見えてから次へ
    };
    opts.append(b);
  }
  const back = el("button", CT.back, { id: "ccBack", class: "back" });
  back.onclick = () => { if (busy) return; if (idx === 0) introView(); else { idx -= 1; questionView(); } };
  if (idx > 0) saveProgress();
  show(progress, herb(isMood ? "lotus" : HERB_NAMES[idx % HERB_NAMES.length], { class: "qherb" }), text, opts, back);
  text.tabIndex = -1; text.setAttribute("aria-describedby", "ccStep"); text.focus({ preventScroll: true });   // 読み上げ・キーボードで次の質問から(外部レビュー 2026-10-20)
}

async function submit(mood) {
  busy = true; rerender = null;
  show(el("p", CT.making, { id: "ccBusy", class: "msg" }));
  const s = checkSubmitScreen(await client.constitutionSubmit({ answers: answers.slice(0, QUESTIONS.length), mood, consent: consentGiven }), Date.now(), lang);
  busy = false;
  if (s.screen === "result" && s.view?.result) { clearProgress(); check = s.view; return resultView(s.view); }
  if (s.screen === "consent") { check = { ...(check || {}), consented: false }; return introView(s.error); }
  if (s.screen === "needs_login") { window.liff.login?.(); return errorView(s.message, false); }
  errorView(s.message, s.retry);
}

// 結果: 今日の傾向(今回の結果。タイプ・五角形・タップで正式名称)・あなたの体質(最新3回の平均)・これまでのチェック(最新6回)・
//       今日のおすすめの一品(今回の結果から)・あなたにおすすめの五巡茶(あなたの体質から)・今日の五巡茶・季節・薬日本堂・診断ではない旨
const chipOf = (h) => { const c = el("span", h.kanji, { class: "chip serif", "data-element": h.element ?? "balanced" });
  if (h.element) { c.style.borderColor = ELEMENT_COLORS[h.element]; c.style.background = ELEMENT_SOFT_COLORS[h.element]; c.style.color = ELEMENT_TEXT_COLORS[h.element]; } return c; };
// 結果を見ている間に言語を変えたら、会員証の API から同じ結果をその言語で作り直す
const rerenderResult = async () => { const s = cardScreen(await client.me(), Date.now(), lang); if (s.screen === "card" && s.view.check?.result) { check = s.view.check; resultView(check); } };
function resultView(v) {
  rerender = rerenderResult;
  const r = v.result, LABELS = CT.kanji;
  const type = kids(el("section", undefined, { class: "panel type", id: "ccResult" }),
    herb("goji", { class: "corner", style: "left:-6px;top:-4px;width:58px" }), herb("chenpi", { class: "corner", style: "right:-4px;top:-2px;width:60px" }),
    el("p", v.latestLabel, { class: "label", id: "ccTodayLabel" }),
    inElementColor(el("h2", r.typeName, { id: "ccTypeName", class: "serif" }), r.element), el("p", r.typeLine, { id: "ccTypeLine", class: "line" }));
  const svg = radarSvg(document, r.scores, { labels: LABELS, max: 6, id: "ccRadar", title: CT.radarTitle, valueText: (x) => String(x ?? "—"),
    dotColors: ELEMENT_COLORS, labelColors: ELEMENT_TEXT_COLORS });                  // 五行の五色(点と軸の名前)
  const detail = el("ul", undefined, { class: "detail", id: "ccDetail", hidden: "" });
  const kanji = (d) => { const k = el("span", d.kanji, { class: "k serif" }); if (ELEMENT_TEXT_COLORS[d.element]) k.style.color = ELEMENT_TEXT_COLORS[d.element]; return k; };
  for (const d of r.details) detail.append(kids(el("li", undefined, d.isPrimary ? { class: "on" } : {}), kanji(d),
    el("span", CT.organLine(d.organ, d.state)), el("span", CT.points(d.score ?? "—"), { class: "s" })));
  const toggle = el("button", CT.detailOpen, { id: "ccDetailToggle", class: "toggle", "aria-expanded": "false", "aria-controls": "ccDetail" });
  const flip = () => { const open = detail.hidden; detail.hidden = !open; toggle.setAttribute("aria-expanded", String(open)); toggle.textContent = open ? CT.detailClose : CT.detailOpen; };
  toggle.onclick = flip; svg.addEventListener("click", flip);
  kids(type, kids(el("div", undefined, { class: "radar-wrap" }), svg), el("p", CT.radarNote, { id: "ccRadarNote", class: "meta" }), toggle, detail);
  if (r.formalText) detail.prepend(el("p", r.formalText, { id: "ccFormal", class: "meta" }));
  detail.prepend(el("p", CT.gogyoNote, { class: "meta" }));                    // 五行とは(外部レビュー 2026-10-20)
  if (r.balanced || r.allHigh) type.append(el("p", CT.evenNote, { id: "ccEvenNote", class: "meta" }));   // おすすめの選び方の説明(ペルソナ実験 2026-10-17)
  const nodes = [type];
  // あなたの体質(最新3回の平均)とこれまでのチェック。1回目は今日の傾向と同じなので出さない(ペルソナ実験 2026-10-17: 同じ内容が2回出ていた)
  const p = v.profile, later = [];
  if (p && p.count > 1) later.push(kids(el("section", undefined, { class: "panel profile", id: "ccProfile" }), el("p", CT.profileLabel, { class: "label" }),
    inElementColor(el("h2", p.typeName, { id: "ccProfileName", class: "serif" }), p.element), el("p", p.basisText, { id: "ccProfileBasis", class: "meta basis" }),
    el("p", p.typeLine, { class: "lead", id: "ccProfileLine" }),
    radarSvg(document, p.scores, { labels: LABELS, max: 6, id: "ccProfileRadar", title: CT.profileRadarTitle,
      valueText: (x) => (typeof x === "number" ? (Math.round(x * 10) / 10).toFixed(1) : "—"), dotColors: ELEMENT_COLORS, labelColors: ELEMENT_TEXT_COLORS })));
  // これまでのチェック(新しい順・最大6回): 日付と五行の印・タイプ名。2回目から
  if (v.history.length > 1) {
    const ul = el("ul", undefined, { class: "history", id: "ccHistory" });
    v.history.forEach((h, i) => ul.append(kids(el("li", undefined, { "data-element": h.element ?? "balanced", ...(i === 0 ? { class: "latest" } : {}) }),
      el("span", h.dateText, { class: "d" }), chipOf(h), el("span", h.typeName, { class: "t" }))));
    later.push(kids(el("section", undefined, { class: "panel", id: "ccHistoryBox" }), el("p", CT.historyTitle(CT.historyLabel), { class: "label" }), ul));
  }
  const dish = r.dish ? kids(el("section", undefined, { class: "panel item", id: "ccDish" }), el("p", v.checkedToday ? CT.dishToday : CT.dishLatest, { class: "label" }),
    el("h3", r.dish.name, { class: "serif" }), el("p", r.dish.reason, { class: "body" }), CT.dishPending ? el("p", CT.dishPending, { class: "meta" }) : null) : null;
  let order = null;
  const table = recallTable(store);
  if (diniiEnabled(cfg)) order = table ? orderTableNodes(table) : visitedToday ? orderNodes() : null;   // ダイニー導入後(店舗IDを設定したら)だけ出す
  // お席の QR から来た人は、おすすめの一品と注文を結果のすぐ下に(ペルソナ実験 2026-10-17: 注文ボタンが遠かった)
  if (table) nodes.push(...[dish, order, ...later].filter(Boolean)); else nodes.push(...[...later, dish, order].filter(Boolean));
  nodes.push(kids(el("section", undefined, { class: "panel item", id: "ccYourTea" }), el("p", CT.yourTeaLabel, { class: "label" }), inElementColor(el("h3", r.yourTea.name, { class: "serif" }), r.yourTea.element),
    el("p", r.yourTea.line, { class: "body" }), el("span", r.yourTea.dayText, { id: "ccYourTeaDay", class: "tea-day" })));
  if (r.todayTea) nodes.push(kids(el("section", undefined, { class: "panel item", id: "ccTodayTea" }), el("p", CT.todayTeaLabel(r.todayTea.weekday), { class: "label" }),
    inElementColor(el("h3", r.todayTea.name, { class: "serif" }), r.todayTea.element), el("p", r.todayTea.line, { class: "body" })));
  if (r.season) nodes.push(kids(el("section", undefined, { class: "panel item", id: "ccSeason" }), el("p", CT.seasonLabel(r.season.name), { class: "label" }), el("p", r.season.line, { class: "body" })));
  const link = el("a", CT.nihondoButton, { id: "ccNihondo", href: NIHONDO_CONSULT_URL, target: "_blank", rel: "noopener noreferrer" });
  link.addEventListener("click", () => { client.referralClick().catch(() => {}); });         // 押された数だけを記録(結果は待たずに開く)
  nodes.push(kids(el("section", undefined, { class: "panel nihondo" }), el("p", CT.nihondoLead, { class: "lead" }), link));
  nodes.push(el("p", CT.disclaimer, { id: "ccDisclaimer", class: "disclaimer" }));
  const again = el("button", CT.retake, { id: "ccRetake", class: "ghost" }); again.onclick = () => { answers = []; idx = 0; consentGiven = false; introView(); };
  nodes.push(toCard(CT.toCard, "primary"), again);
  show(...nodes);
}

// このまま注文する(お席の QR から入ったとき): そのテーブルのダイニーの注文画面へ。読み直さない
function orderTableNodes(table) {
  const url = diniiTableUrl(table, { shopId: cfg.diniiShopId, liffId: cfg.diniiLiffId });
  if (!url) return null;
  return kids(el("section", undefined, { class: "panel item", id: "ccOrder" }), el("p", OT.label, { class: "label" }),
    el("p", OT.note, { id: "ccOrderNote", class: "meta" }), el("a", OT.table, { id: "ccOrderTable", class: "primary", href: url }));
}

// このまま注文する(来店した日・お席の QR から入っていないとき): LIFF のカメラでお席のQRを読み、10ZEN のダイニーの注文用のQRのときだけ開く(app-core/dinii.mjs)。カメラが使えない端末では案内の文だけ
function orderNodes() {
  const box = el("section", undefined, { class: "panel item", id: "ccOrder" }), msg = el("p", "", { id: "ccOrderMsg", class: "body", role: "status" });
  const canScan = typeof window.liff?.scanCodeV2 === "function" && window.liff.isApiAvailable?.("scanCodeV2") !== false;
  const note = el("p", OT.note, { id: "ccOrderNote", class: "meta" });
  if (!canScan) return kids(box, el("p", OT.label, { class: "label" }), note, el("p", OT.noScan, { class: "body" }));
  const b = el("button", OT.scan, { id: "ccOrderScan", class: "primary", type: "button" });
  b.onclick = async () => {
    msg.textContent = "";
    let r; try { r = await window.liff.scanCodeV2(); } catch (_e) { msg.textContent = OT.noScan; return; }
    const url = diniiOrderUrl(r?.value, { shopId: cfg.diniiShopId, liffId: cfg.diniiLiffId });
    if (!url) { msg.textContent = OT.notDinii; return; }
    window.location.assign(url);
  };
  return kids(box, el("p", OT.label, { class: "label" }), note, b, msg);
}

async function start() {
  rerender = start;
  const s = cardScreen(await client.me(), Date.now(), lang);
  if (s.screen === "register") {                                              // その場で登録して体質チェックへ(ペルソナ実験 2026-10-17: 会員証を経由すると遠回り)
    const b = el("button", CT.registerButton, { id: "ccRegister", class: "primary" });
    b.onclick = async () => { b.disabled = true; const prof = await window.liff.getProfile?.().catch?.(() => null); const r = await client.register({ displayName: prof?.displayName });
      if (r.kind === "ok" || r.kind === "conflict") return start(); b.disabled = false; errorView(CT.registerFailed, true); };
    return show(el("p", CT.registerLead, { id: "msg", class: "msg" }), b, toCard(CT.toCardShort));
  }
  if (s.screen === "needs_login") { window.liff.login?.(); return errorView(s.message, false); }
  if (s.screen !== "card") return errorView(s.message, s.retry);
  check = s.view.check; visitedToday = !!s.view.visitedToday;
  if (!check) return errorView(CT.preparing, false);           // DB が未対応(103 未適用)
  const qs = new URLSearchParams(location.search);
  if (qs.get("view") === "result" && check.result) return resultView(check);
  if (qs.get("start") === "1" && check.consented) { answers = []; idx = 0; consentGiven = false; return questionView(); }   // 会員証の「今日のチェックをはじめる」から(同意済み)
  introView();
}
(async () => {
  try { await window.liff.init({ liffId: cfg.liffId }); } catch (_e) { return show(el("p", CT.openInLine, { id: "msg", class: "msg" })); }
  setLang(storedLang(langStore) ? lang : detectLang({ liff: window.liff.getLanguage?.(), nav: navigator.languages }));   // LINE の言語(選んだことがなければ)
  if (!window.liff.isLoggedIn()) { window.liff.login(); return; }
  client = createMemberClient({ endpoint: cfg.memberApi, getIdToken: async () => window.liff.getIDToken() });
  start();
})();
</script>
</body></html>
