<!doctype html>
<!-- 店頭タブレット専用ページ(参照実装)。表示するのは店頭QRだけ。会員情報・ポイント・スタッフ操作へのリンクや機能は一切ない。
     店頭QR専用アカウント(role=kiosk)でログインする。そのアカウントは DB 側でも他の操作がすべて拒否される。最終UIはこのファイルを差し替える。 -->
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>10ZEN 店頭QR</title></head>
<body>
<main id="app"></main>
<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script src="vendor/qrcode.js"></script>
<script type="module">
import { createStaffClient, createQrKiosk } from "../app-core/staff-client.mjs";
const cfg = window.APP_CONFIG, app = document.getElementById("app");
const el = (tag, text, attrs = {}) => { const e = document.createElement(tag); if (text !== undefined) e.textContent = text; for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); return e; };
const sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey);
const staff = createStaffClient({ supabase: sb, qrEndpoint: cfg.staffQrApi });
let kiosk = null;
// URL を QR の SVG にする(ライブラリは同梱の qrcode.js。SVG は数値だけの文字列を DOMParser で読み、文字列を HTML として差し込まない)
function qrSvg(text) {
  const q = window.qrcode(0, "M"); q.addData(text); q.make();
  const doc = new DOMParser().parseFromString(q.createSvgTag({ cellSize: 8, margin: 16, scalable: true }), "image/svg+xml");
  const svg = document.importNode(doc.documentElement, true); svg.setAttribute("style", "width:min(80vmin,480px);height:auto;background:#fff"); return svg;
}
async function start() {
  const w = await staff.whoami();
  if (w.kind !== "ok" || !w.data.active || w.data.role !== "kiosk") { if (w.kind === "ok" && w.data.active) await staff.signOut(); return loginView(w.kind === "ok" && w.data.active ? "店頭QR専用のアカウントでログインしてください" : null); }
  const url = el("pre", "", { id: "qrUrl", hidden: "" }), msg = el("p", "", { id: "qrMsg" }), box = el("div", undefined, { id: "qrImage", role: "img", "aria-label": "来店用のQRコード" });
  app.replaceChildren(el("h1", "ご来店の方は、このQRコードを LINE で読み取ってください"), box, url, msg);   // URL は画面に出さない(テスト用に非表示で保持)
  kiosk = createQrKiosk({ getToken: () => staff.qrToken(), onUpdate: (d) => { url.textContent = d.url; msg.textContent = ""; box.replaceChildren(qrSvg(d.url)); }, onHidden: () => { url.textContent = ""; box.replaceChildren(); msg.textContent = "ただいま表示できません。スタッフにお声がけください"; } });
  kiosk.start();
}
function loginView(msg) {
  if (kiosk) { kiosk.stop(); kiosk = null; }
  const e = el("input", undefined, { id: "email", type: "email", autocomplete: "username" }), p = el("input", undefined, { id: "password", type: "password", autocomplete: "current-password" }), b = el("button", "開始", { id: "login" });
  const m = el("p", msg || "", { id: "msg" });
  b.onclick = async () => { const r = await staff.signIn(e.value, p.value); if (r.kind !== "ok") { m.textContent = "ログインできませんでした"; return; } start(); };
  app.replaceChildren(e, p, b, m);
}
start();
</script>
</body></html>
